        id: `${event.id}-${consRoundNames[0]}-${mNum}`,
        round: consRoundNames[0], eventId: event.id,
        team1Id: null, team2Id: null,
        feedsFrom: [],
        feedsFromLosers: [encode(f1), encode(f2)],
        label: longLabel(consRoundNames[0]),
      };
      matches.push(m);
      entries.push({ winnerOf: m.id });
      mNum++;
    } else if (f1) {
      entries.push({ losesFrom: encode(f1) });
    }
  }

  // Subsequent rounds
  for (let r = 1; r < consRoundNames.length; r++) {
    const newEntries = [];
    let rmNum = 1;
    for (let i = 0; i < entries.length; i += 2) {
      const e1 = entries[i] || {}, e2 = entries[i + 1] || {};
      const m = {
        id: `${event.id}-${consRoundNames[r]}-${rmNum}`,
        round: consRoundNames[r], eventId: event.id,
        team1Id: null, team2Id: null,
        feedsFrom: [e1.winnerOf || null, e2.winnerOf || null],
        feedsFromLosers: [e1.losesFrom || null, e2.losesFrom || null],
        label: longLabel(consRoundNames[r]),
      };
      matches.push(m);
      newEntries.push({ winnerOf: m.id });
      rmNum++;
    }
    entries = newEntries;
  }
  return matches;
}
function generateDoubleElim(event, teams) {
  const n = teams.length;
  if (n < 2) return [];
  // We support clean double-elim for power-of-2 draws from 4 up to 32 teams.
  // Non-power-of-2 falls back to single-elim with consolation, which gives
  // every team at least 2 matches (similar in spirit to a partial DE).
  const isPow2 = (n & (n - 1)) === 0;
  if (!isPow2 || n > 32) {
    const main = generateSingleElim(event, teams);
    const cons = generateConsolation(event, main);
    return [...main, ...cons];
  }
  return generateDoubleElimGeneral(event, teams);
}

// General double-elimination generator for power-of-2 team counts. Builds:
//   - Winners bracket (WB):   log2(n) rounds, full single-elim tree with proper seeding
//   - Losers bracket (LB):    2 * log2(n) - 2 rounds, alternating "merge" rounds
//                             (which take a WB loser + the prior LB winner) and
//                             "pair" rounds (which pair two LB winners)
//   - Grand Final (GF):       1 match, WB final winner vs LB final winner
//
// Round naming: WR1 is always first; the last round is WF (winners final), the
// second-to-last is WSF (winners SF), the third-to-last (when present) is WQF.
// Earlier rounds use WR2, WR3, WR4. LB follows the same pattern with LF/LSF
// at the end and LR1..LRn for earlier rounds.
function generateDoubleElimGeneral(event, teams) {
  const n = teams.length;
  const numWBRounds = Math.log2(n);
  const numLBRounds = 2 * numWBRounds - 2;
  const matches = [];

  // Helper for round names so the last 1-2 rounds get semantic labels (WF/WSF/WQF, LF/LSF).
  const wbRoundName = (rIdx) => {
    if (rIdx === numWBRounds - 1) return 'WF';
    if (rIdx === numWBRounds - 2) return 'WSF';
    if (rIdx === numWBRounds - 3) return 'WQF';
    return `WR${rIdx + 1}`;
  };
  const lbRoundName = (rIdx) => {
    if (rIdx === numLBRounds - 1) return 'LF';
    if (rIdx === numLBRounds - 2) return 'LSF';
    return `LR${rIdx + 1}`;
  };

  // ---- Winners bracket ----
  // Use the same seeded layout that single_elim uses, so a 1 vs 8, 4 vs 5,
  // 3 vs 6, 2 vs 7 R1 (and equivalents for n=16, 32) plays out properly.
  const positions = seededBracketPositions(n);
  const layout = positions.map(p => teams[p - 1]);
  const wbRounds = [];
  let prevRound = [];
  for (let i = 0; i < layout.length; i += 2) {
    const m = {
      id: `${event.id}-WR1-${(i / 2) + 1}`,
      round: 'WR1',
      eventId: event.id,
      team1Id: layout[i].id,
      team2Id: layout[i + 1].id,
      feedsFrom: [],
      feedsFromLosers: [],
      label: 'Winners Round 1',
    };
    matches.push(m);
    prevRound.push(m);
  }
  wbRounds.push(prevRound);
  for (let r = 1; r < numWBRounds; r++) {
    const newRound = [];
    const roundName = wbRoundName(r);
    for (let i = 0; i < prevRound.length; i += 2) {
      const m = {
        id: `${event.id}-${roundName}-${(i / 2) + 1}`,
        round: roundName,
        eventId: event.id,
        team1Id: null, team2Id: null,
        feedsFrom: [prevRound[i].id, prevRound[i + 1].id],
        feedsFromLosers: [],
        label: `Winners ${longLabel(roundName).replace('Winners ', '')}`,
      };
      matches.push(m);
      newRound.push(m);
    }
    wbRounds.push(newRound);
    prevRound = newRound;
  }

  // ---- Losers bracket ----
  // LR1: pair WB-R1 losers (no WB-R1 winner enters LB at this stage).
  let lbPrev = [];
  const wbR1 = wbRounds[0];
  for (let i = 0; i < wbR1.length; i += 2) {
    const m = {
      id: `${event.id}-LR1-${(i / 2) + 1}`,
      round: 'LR1',
      eventId: event.id,
      team1Id: null, team2Id: null,
      feedsFrom: [],
      feedsFromLosers: [wbR1[i].id, wbR1[i + 1].id],
      label: 'Losers Round 1',
    };
    matches.push(m);
    lbPrev.push(m);
  }

  // LB rounds 2..N. Pattern alternates:
  //   - Odd-indexed rounds (rIdx 1, 3, 5, ...) are "merge" rounds:
  //     team1 = LB previous winner, team2 = corresponding WB-round loser.
  //   - Even-indexed rounds (rIdx 2, 4, 6, ...) are "pair" rounds:
  //     winners of two LB-prev matches paired together.
  // (LR1 itself is rIdx 0 — already handled above.)
  let wbRoundForMerge = 1;  // index into wbRounds for the next loser-feed
  for (let rIdx = 1; rIdx < numLBRounds; rIdx++) {
    const newRound = [];
    const roundName = lbRoundName(rIdx);
    if (rIdx % 2 === 1) {
      // Merge round: combine LB winners with WB-round-N losers
      const wbRound = wbRounds[wbRoundForMerge];
      for (let i = 0; i < wbRound.length; i++) {
        const m = {
          id: `${event.id}-${roundName}-${i + 1}`,
          round: roundName,
          eventId: event.id,
          team1Id: null, team2Id: null,
          feedsFrom: [lbPrev[i].id, null],
          feedsFromLosers: [null, wbRound[i].id],
          label: `Losers ${longLabel(roundName).replace('Losers ', '')}`,
        };
        matches.push(m);
        newRound.push(m);
      }
      wbRoundForMerge++;
    } else {
      // Pair round: pair LB-prev winners
      for (let i = 0; i < lbPrev.length; i += 2) {
        const m = {
          id: `${event.id}-${roundName}-${(i / 2) + 1}`,
          round: roundName,
          eventId: event.id,
          team1Id: null, team2Id: null,
          feedsFrom: [lbPrev[i].id, lbPrev[i + 1].id],
          feedsFromLosers: [],
          label: `Losers ${longLabel(roundName).replace('Losers ', '')}`,
        };
        matches.push(m);
        newRound.push(m);
      }
    }
    lbPrev = newRound;
  }

  // ---- Grand Final ----
  // WB final winner vs LB final winner. We DON'T generate a "reset" match —
  // most clubs run a single GF since LB has already played twice the matches.
  // (If we wanted true double elim, we'd add a conditional GF-2 that fires only
  //  when LB winner takes GF-1.)
  const wbFinal = wbRounds[wbRounds.length - 1][0];
  const lbFinal = lbPrev[0];
  matches.push({
    id: `${event.id}-GF-1`,
    round: 'GF',
    eventId: event.id,
    team1Id: null, team2Id: null,
    feedsFrom: [wbFinal.id, lbFinal.id],
    feedsFromLosers: [],
    label: 'Grand Final',
  });

  return matches;
}

/* ============================================================
   MULTI-POOL ROUND ROBIN → PLAYOFF
   ============================================================ */

// Default pool config when format is set to multi_pool but no config exists yet.
function defaultPoolConfig(teamCount) {
  // Try to pick a sensible default based on team count.
  // Prefer pools of 4 if it divides evenly; otherwise pools of 3 or 5.
  if (teamCount % 4 === 0) return { poolSize: 4, advancePerPool: 2 };
  if (teamCount % 5 === 0) return { poolSize: 5, advancePerPool: 2 };
  if (teamCount % 3 === 0) return { poolSize: 3, advancePerPool: 1 };
  return { poolSize: 4, advancePerPool: 2 };  // fall through; user will adjust if invalid
}

// Snake-draft team distribution into pools.
// For 4 pools of 4 (16 teams seeded 1..16), produces:
//   Pool 1: seeds 1, 8, 9, 16
//   Pool 2: seeds 2, 7, 10, 15
//   Pool 3: seeds 3, 6, 11, 14
//   Pool 4: seeds 4, 5, 12, 13
// This keeps top seeds spread evenly so each pool has comparable strength.
function distributeTeamsToPools(teams, numPools, poolSize) {
  const pools = Array.from({ length: numPools }, () => []);
  let direction = 1;
  let poolIdx = 0;
  let row = 0;
  for (let i = 0; i < teams.length && i < numPools * poolSize; i++) {
    pools[poolIdx].push(teams[i]);
    poolIdx += direction;
    if (poolIdx >= numPools) { poolIdx = numPools - 1; direction = -1; row++; }
    else if (poolIdx < 0)    { poolIdx = 0;            direction =  1; row++; }
  }
  return pools;
}

// Generate matches for multi-pool format. Two phases:
//   1. Pool play — each pool runs a round-robin among its teams. Match round
//      names are RR1, RR2, ... so the existing RR scoring/standings logic works.
//      Each match is tagged with poolIdx so we can compute per-pool standings.
//   2. Playoff — single-elimination bracket whose slots are populated by pool
//      finishers via a new "feedsFromPool" feeder type. Cross-pool seeding
//      ensures pool winners only meet pool winners (or runners-up) in late rounds.
function generateMultiPool(event, teams) {
  const cfg = event.poolConfig || defaultPoolConfig(teams.length);
  const poolSize = cfg.poolSize || 4;
  const advancePerPool = cfg.advancePerPool || 2;
  if (teams.length < poolSize * 2) return [];   // need at least 2 pools to be a multi-pool

  const numPools = Math.floor(teams.length / poolSize);
  if (numPools < 2) return [];

  const pools = distributeTeamsToPools(teams, numPools, poolSize);

  // Stamp each team with its pool index so the renderer/standings logic knows
  // which pool a given team belongs to.
  for (let p = 0; p < numPools; p++) {
    for (const t of pools[p]) t.poolIdx = p;
  }

  const matches = [];

  // ---- Pool play: round-robin within each pool ----
  for (let p = 0; p < numPools; p++) {
    const poolTeams = pools[p];
    const poolMatches = generateRoundRobin(
      // Use a synthetic event id so generated match IDs don't collide across pools
      { ...event, id: `${event.id}-P${p + 1}` },
      poolTeams
    );
    for (const m of poolMatches) {
      m.poolIdx = p;          // remember which pool this match belongs to
      m.eventId = event.id;   // restore correct event id
    }
    matches.push(...poolMatches);
  }

  // ---- Playoff bracket ----
  // Total advancing = numPools × advancePerPool. We bracket those into a single
  // elimination tree using cross-pool seeding (1A vs 2B, 1B vs 2A, etc).
  const playoffSize = numPools * advancePerPool;
  const playoffRounds = roundNamesForSize(playoffSize);

  // Build the seeded slot layout for the playoff bracket. Each slot is a pool
  // feeder { poolIdx, position }. We use a standard cross-pool pattern: top-seed
  // pool winners on opposite ends of the bracket, runners-up cross-paired.
  const slots = buildPlayoffSlots(numPools, advancePerPool);

  // R1 of playoff: pair adjacent slots
  let prevRound = [];
  for (let i = 0; i < slots.length; i += 2) {
    const m = {
      id: `${event.id}-PO-${playoffRounds[0]}-${(i / 2) + 1}`,
      round: playoffRounds[0],
      eventId: event.id,
      team1Id: null, team2Id: null,
      feedsFrom: [],
      feedsFromLosers: [],
      feedsFromPool: { team1: slots[i], team2: slots[i + 1] },
      label: longLabel(playoffRounds[0]),
      isPlayoff: true,
    };
    matches.push(m);
    prevRound.push(m);
  }

  // R2+: feed from previous round winners, like normal single elim
  for (let r = 1; r < playoffRounds.length; r++) {
    const newRound = [];
    for (let i = 0; i < prevRound.length; i += 2) {
      const m = {
        id: `${event.id}-PO-${playoffRounds[r]}-${(i / 2) + 1}`,
        round: playoffRounds[r],
        eventId: event.id,
        team1Id: null, team2Id: null,
        feedsFrom: [prevRound[i].id, prevRound[i + 1].id],
        feedsFromLosers: [],
        label: longLabel(playoffRounds[r]),
        isPlayoff: true,
      };
      matches.push(m);
      newRound.push(m);
    }
    prevRound = newRound;
  }

  return matches;
}

// Build the seeded slot layout for the playoff bracket. Each slot is a pool
// feeder. Cross-pool seeding pattern (4 pools, 2 advance = 8-team playoff):
//   Slot 1 = 1A    (Pool A winner)
//   Slot 2 = 2D    (Pool D runner-up)
//   Slot 3 = 1C    (Pool C winner)
//   Slot 4 = 2B    (Pool B runner-up)
//   Slot 5 = 1B    (Pool B winner)
//   Slot 6 = 2C    (Pool C runner-up)
//   Slot 7 = 1D    (Pool D winner)
//   Slot 8 = 2A    (Pool A runner-up)
// Pool A winner can only meet Pool A runner-up in the FINAL.
function buildPlayoffSlots(numPools, advancePerPool) {
  const slots = [];
  // Strategy: arrange pool winners using the same seeded bracket positions used
  // for elim brackets, then layer runners-up alternating in the gaps. For most
  // common setups (2-4 pools, 1-3 advance), this produces clean cross-pairings.
  if (advancePerPool === 1) {
    // Just bracket the pool winners directly using seeded positions.
    const positions = seededBracketPositions(numPools);
    return positions.map(p => ({ poolIdx: p - 1, position: 1 }));
  }
  // For advancePerPool >= 2, alternate pool-winner → runner-up across slots.
  // Use seeded positions for the winners, fill runners-up such that A1 and A2
  // are on opposite halves, A1 and B2 face off in R1, etc.
  const winnerPositions = seededBracketPositions(numPools);  // e.g. [1, 4, 2, 3] for 4 pools

  // Place pool winners at every other slot (slots 0, 2, 4, ...)
  const totalSlots = numPools * advancePerPool;
  const winnerSlots = [];
  for (let i = 0; i < numPools; i++) winnerSlots.push(i * advancePerPool);
  for (let i = 0; i < numPools; i++) {
    slots[winnerSlots[i]] = { poolIdx: winnerPositions[i] - 1, position: 1 };
  }
  // Fill remaining slots with runners-up. Pair each winner with a runner-up
  // from a DIFFERENT pool so we don't get same-pool R1 rematches.
  for (let i = 0; i < numPools; i++) {
    for (let pos = 2; pos <= advancePerPool; pos++) {
      // Pick the pool that's "across" from this winner (opposite end of bracket).
      const acrossWinnerIdx = numPools - 1 - i;
      const targetPool = winnerPositions[acrossWinnerIdx] - 1;
      // Find next empty slot
      for (let s = 0; s < totalSlots; s++) {
        if (!slots[s]) { slots[s] = { poolIdx: targetPool, position: pos }; break; }
      }
    }
  }
  return slots;
}

/* ============================================================
   PRO-AM FORMAT
   ------------------------------------------------------------
   A Pro-Am event consists of "flights" (groups of teams playing
   round-robin within the group). Each team has 4 players with
   roles: Pro, A, B, C. An "encounter" between two teams plays out
   in 3 rounds of 2 simultaneous matches each:
     Round 1: Pro/A vs Pro/A  +  B/C vs B/C
     Round 2: Pro/B vs Pro/B  +  A/C vs A/C
     Round 3: Pro/C vs Pro/C  +  A/B vs A/B
   Each sub-match is a 16-game pro-set; the scoring is by total
   games won, not sets. Standings = sum of games across all
   matches, with head-to-head tiebreaker.
   Default: 8 teams → 2 flights of 4 + a final encounter between
   flight winners. Auto-splits by team order if the TD hasn't
   manually assigned flights.
   ============================================================ */

// Round-tied schedule for Pro-Am. The partnership rotation is determined by
// ROUND NUMBER, not by team-pair encounter. Across 3 rounds, each player on a
// team partners with each teammate exactly once. Round-1 schedule pairs teams
// 1v2 + 3v4 simultaneously, round-2 pairs 1v3 + 2v4, round-3 pairs 1v4 + 2v3 —
// so each team plays each other team exactly once, and only ONCE per flight.
const PROAM_ROUNDS = [
  {
    round: 1,
    lines: [
      { line: 'PC', roles: ['pro', 'c'] },
      { line: 'AB', roles: ['a',   'b'] },
    ],
  },
  {
    round: 2,
    lines: [
      { line: 'PB', roles: ['pro', 'b'] },
      { line: 'AC', roles: ['a',   'c'] },
    ],
  },
  {
    round: 3,
    lines: [
      { line: 'PA', roles: ['pro', 'a'] },
      { line: 'BC', roles: ['b',   'c'] },
    ],
  },
];

// Standard 4-team round-robin schedule (1-indexed). Each sub-array is one round,
// with two simultaneous matchups (pairs of team indices). Index aligns with PROAM_ROUNDS.
const PROAM_TEAM_SCHEDULE = [
  [[1, 2], [3, 4]],   // Round 1: 1v2 + 3v4
  [[1, 3], [2, 4]],   // Round 2: 1v3 + 2v4
  [[1, 4], [2, 3]],   // Round 3: 1v4 + 2v3
];

// Friendly label for a pairing line. PA → "Pro/A", BC → "B/C", etc.
function proAmLineLabel(lineCode) {
  return lineCode.split('').map(ch => ch.toUpperCase() === 'P' ? 'Pro' : ch.toUpperCase()).join('/');
}

// Auto-divide teams into flights of 4. For 8 teams → 2 flights;
// for 4 teams → 1 flight; otherwise distributes evenly. The TD can
// override this manually after generation by editing event.flights.
function autoSplitProAmFlights(event, teams) {
  const FLIGHT_SIZE = 4;
  const flights = [];
  for (let i = 0; i < teams.length; i += FLIGHT_SIZE) {
    const slice = teams.slice(i, i + FLIGHT_SIZE);
    if (slice.length < 2) {
      // Tail flight has fewer than 2 teams — merge it into the previous flight
      // rather than create an unplayable flight of 1.
      if (flights.length > 0) {
        flights[flights.length - 1].teamIds.push(...slice.map(t => t.id));
      }
      continue;
    }
    flights.push({
      id: `${event.id}-F${flights.length + 1}`,
      name: `Flight ${flights.length + 1}`,
      teamIds: slice.map(t => t.id),
    });
  }
  return flights;
}

// Generate all matches for a Pro-Am flight. Requires exactly 4 teams (the
// standard Pro-Am format). Produces 12 sub-matches total: 3 rounds × 2
// matchups per round × 2 sub-matches per matchup. The partnership rotation
// is tied to the round number, so each player partners with each teammate
// exactly once across the flight.
function generateProAmFlight(event, flight, allTeams) {
  const flightTeams = (flight.teamIds || [])
    .map(id => allTeams.find(t => t.id === id))
    .filter(Boolean);
  // Pro-Am is designed for exactly 4 teams per flight. Anything else won't fit
  // the 3-round rotation cleanly — return [] and let the TD see the warning
  // in the bracket view.
  if (flightTeams.length !== 4) return [];

  const matches = [];
  PROAM_ROUNDS.forEach((roundDef, rIdx) => {
    const matchups = PROAM_TEAM_SCHEDULE[rIdx];
    matchups.forEach((matchupPair, matchupIdx) => {
      const t1 = flightTeams[matchupPair[0] - 1];
      const t2 = flightTeams[matchupPair[1] - 1];
      const matchupSlot = matchupIdx + 1;
      roundDef.lines.forEach(({ line, roles }) => {
        matches.push({
          id: `${event.id}-${flight.id}-R${roundDef.round}-M${matchupSlot}-${line}`,
          round: `${flight.name}-R${roundDef.round}-${line}`,
          eventId: event.id,
          team1Id: t1.id,
          team2Id: t2.id,
          feedsFrom: [],
          proAm: {
            flightId: flight.id,
            flightName: flight.name,
            round: roundDef.round,
            matchupSlot: matchupSlot,
            line: line,
            roles: roles,
            isFinal: false,
          },
          label: `${flight.name} · Round ${roundDef.round} · ${proAmLineLabel(line)}`,
        });
      });
    });
  });
  return matches;
}

// Final between top teams of each flight. Since only ONE pair of teams plays
// in the final, all 3 partnership rotations happen between just these two
// teams — so the final has 6 sub-matches (3 rounds × 2 lines × 1 matchup).
// Generate the Final between two flight winners. Unlike the round-robin flight
// play (where partnerships rotate across 3 rounds), the Final is a SINGLE round
// with two simultaneous sub-matches: Pro/A vs Pro/A, and B/C vs B/C. Total
// games across both sub-matches decides the champion. Mirrors how Lobapalooza
// and most clubs actually run the Pro-Am final: a quick head-to-head shoot-out
// between flight winners, not another 3-round round-robin (which would only
// make sense if there were more than 2 teams).
function generateProAmFinal(event, flights) {
  if (flights.length !== 2) return [];   // only do final for exactly 2 flights
  const finalFlightId = `${event.id}-FINAL`;
  const FINAL_LINES = [
    { line: 'PA', roles: ['pro', 'a'] },
    { line: 'BC', roles: ['b',   'c'] },
  ];
  return FINAL_LINES.map(({ line, roles }) => ({
    id: `${event.id}-FINAL-${line}`,
    round: `Final-${line}`,
    eventId: event.id,
    team1Id: null,    // populated when Flight 1 winner is determined
    team2Id: null,    // populated when Flight 2 winner is determined
    feedsFrom: [
      { type: 'proAmFlightWinner', flightId: flights[0].id, slot: 'team1' },
      { type: 'proAmFlightWinner', flightId: flights[1].id, slot: 'team2' },
    ],
    proAm: {
      flightId: finalFlightId,
      flightName: 'Final',
      round: 1,           // single round (kept as 1 so the scheduler still groups it)
      matchupSlot: 1,
      line: line,
      roles: roles,
      isFinal: true,
    },
    label: `Final · ${proAmLineLabel(line)}`,
  }));
}

// Top-level generator for Pro-Am events. Auto-splits flights if not configured,
// generates all flight matches, plus a placeholder final between flight winners.
function generateProAm(event, teams) {
  if (!teams || teams.length === 0) return [];
  // Build flights from event.flights if set, otherwise auto-split
  if (!event.flights || event.flights.length === 0) {
    event.flights = autoSplitProAmFlights(event, teams);
  }
  // Verify each flight references valid team IDs
  const teamIdSet = new Set(teams.map(t => t.id));
  event.flights = event.flights.map(f => ({
    ...f,
    teamIds: (f.teamIds || []).filter(id => teamIdSet.has(id)),
  })).filter(f => f.teamIds.length >= 2);
  if (event.flights.length === 0) return [];

  const matches = [];
  for (const flight of event.flights) {
    matches.push(...generateProAmFlight(event, flight, teams));
  }
  // Final round between top of each flight (only when exactly 2 flights)
  matches.push(...generateProAmFinal(event, event.flights));
  return matches;
}

// Compute team standings within a single Pro-Am flight. Returns sorted array
// of { team, played, games, gamesAgainst, matchups, matchupsWon } ordered by
// total games won (tiebreaker: head-to-head total games in the direct matchup).
// Each team plays 3 matchups in the flight (one per round), each matchup has
// 2 sub-matches, so 6 sub-match scores feed each team's totals.
function computeProAmFlightStandings(event, flight) {
  const teams = (flight.teamIds || [])
    .map(id => (event.teams || []).find(t => t.id === id))
    .filter(Boolean);
  const records = new Map();
  for (const t of teams) records.set(t.id, {
    team: t, played: 0, games: 0, gamesAgainst: 0,
    matchups: 0, matchupsWon: 0,
  });

  // Bucket sub-matches by matchup (round + matchupSlot) so we can roll up
  // matchup-level totals (which determine matchup wins and head-to-head).
  const byMatchup = new Map();
  for (const m of (event.matches || [])) {
    if (!m.proAm || m.proAm.flightId !== flight.id || m.proAm.isFinal) continue;
    const key = `R${m.proAm.round}-M${m.proAm.matchupSlot}`;
    if (!byMatchup.has(key)) {
      byMatchup.set(key, {
        t1Id: m.team1Id, t2Id: m.team2Id,
        t1Games: 0, t2Games: 0, completed: 0,
      });
    }
    const mu = byMatchup.get(key);
    const scores = state.scores?.[m.id];
    if (!scores || scores.length === 0) continue;
    const t1g = scores.reduce((s, set) => s + (parseInt(set.t1) || 0), 0);
    const t2g = scores.reduce((s, set) => s + (parseInt(set.t2) || 0), 0);
    mu.t1Games += t1g;
    mu.t2Games += t2g;
    mu.completed++;
  }

  // Roll up matchup totals into team records.
  for (const [, mu] of byMatchup) {
    if (mu.completed === 0) continue;
    const r1 = records.get(mu.t1Id);
    const r2 = records.get(mu.t2Id);
    if (r1) { r1.games += mu.t1Games; r1.gamesAgainst += mu.t2Games; r1.played++; }
    if (r2) { r2.games += mu.t2Games; r2.gamesAgainst += mu.t1Games; r2.played++; }
    // Matchup wins only count once both sub-matches in the matchup are scored.
    if (mu.completed === 2) {
      if (r1) r1.matchups++;
      if (r2) r2.matchups++;
      if (mu.t1Games > mu.t2Games)      { if (r1) r1.matchupsWon++; }
      else if (mu.t2Games > mu.t1Games) { if (r2) r2.matchupsWon++; }
    }
  }

  // Head-to-head total games for tiebreaker — sum of A's games against B in
  // their one direct matchup.
  function headToHeadGamesFor(aId, bId) {
    for (const [, mu] of byMatchup) {
      if (mu.t1Id === aId && mu.t2Id === bId) return mu.t1Games;
      if (mu.t1Id === bId && mu.t2Id === aId) return mu.t2Games;
    }
    return 0;
  }

  return Array.from(records.values()).sort((a, b) => {
    if (b.games !== a.games) return b.games - a.games;
    const aH2H = headToHeadGamesFor(a.team.id, b.team.id);
    const bH2H = headToHeadGamesFor(b.team.id, a.team.id);
    if (bH2H !== aH2H) return bH2H - aH2H;
    return 0;
  });
}

// Resolve the actual two players for a side of a Pro-Am match. Returns
// [{name, role}, {name, role}] or fewer if the team doesn't have all roles set.
// Default Pro-Am team name when the TD hasn't set an explicit name. Convention
// (per Lobapalooza posters and how clubs actually run Pro-Am): the team is
// "Team [Pro's first name]" — e.g. "Team Alex", "Team Ben". The Pro is the
// captain/headliner, so the team takes the Pro's first name. Falls back to the
// first player on the team if no role data is available.
function proAmDefaultTeamName(team) {
  if (!team) return 'Team';
  // Look for the Pro player by role; fall back to first player on the team
  let proName = null;
  if (Array.isArray(team.playerRoles)) {
    const idx = team.playerRoles.indexOf('pro');
    if (idx !== -1 && team.players[idx]) proName = team.players[idx];
  }
  if (!proName && team.players && team.players[0]) proName = team.players[0];
  if (!proName) return 'Team';
  // First name = first whitespace-separated token
  const firstName = (proName || '').trim().split(/\s+/)[0] || 'Team';
  return `Team ${firstName}`;
}
function getProAmSidePlayers(team, roles) {
  if (!team) return [];
  const out = [];
  for (const role of roles) {
    // Match by playerRoles array (parallel to players)
    if (Array.isArray(team.playerRoles)) {
      const idx = team.playerRoles.indexOf(role);
      if (idx !== -1 && team.players[idx]) {
        out.push({ name: team.players[idx], role });
        continue;
      }
    }
    out.push({ name: '?', role });
  }
  return out;
}

// Pretty label like "Smith (Pro) / Jones (A)"
function proAmSideLabel(team, roles) {
  const players = getProAmSidePlayers(team, roles);
  return players.map(p => p.name).join(' / ');
}

/* ===== END PRO-AM FORMAT ===== */

// Render the Pro-Am bracket view: flight standings + encounter cards + final.
// Used by both the TD console (interactive=true → clickable match cells) and
// the public participant view (interactive=false → read-only). The structure
// is the same in both cases; only score-entry behavior differs.
function computePoolStandings(event, poolIdx) {
  const teamsInPool = (event.teams || []).filter(t => t.poolIdx === poolIdx);
  const records = new Map();
  for (const t of teamsInPool) records.set(t.id, { team: t, W: 0, L: 0 });
  for (const m of (event.matches || [])) {
    if (m.poolIdx !== poolIdx) continue;
    if (m.isPlayoff) continue;  // playoff matches don't count toward pool standings
    const result = state.results?.[m.id];
    if (!result) continue;
    const t1 = m.team1Id ? findTeam(m.team1Id) : null;
    const t2 = m.team2Id ? findTeam(m.team2Id) : null;
    if (!t1 || !t2) continue;
    const winner = result === 'team1' ? t1 : t2;
    const loser  = result === 'team1' ? t2 : t1;
    if (records.has(winner.id)) records.get(winner.id).W++;
    if (records.has(loser.id))  records.get(loser.id).L++;
  }
  const standings = [...records.values()].map(r => {
    const games = r.W + r.L;
    return { ...r, pct: games > 0 ? r.W / games : 0, played: games };
  });
  // Sort: W desc, PCT desc, then by seed (higher seed = original team order)
  standings.sort((a, b) => {
    if (b.W !== a.W) return b.W - a.W;
    if (b.pct !== a.pct) return b.pct - a.pct;
    // Tiebreaker: head-to-head if exactly 2 tied (cleaner than nothing for v1)
    const h2h = headToHeadAdvantage(event, poolIdx, a.team.id, b.team.id);
    if (h2h !== 0) return h2h;
    // Final fallback: original team order (seed)
    return (a.team.seed || 0) - (b.team.seed || 0);
  });
  return standings;
}

// Head-to-head tiebreaker: who beat whom in pool play. Returns:
//   negative if A beat B (A should rank higher),
//   positive if B beat A,
//   0 if no head-to-head match exists.
function headToHeadAdvantage(event, poolIdx, idA, idB) {
  for (const m of (event.matches || [])) {
    if (m.poolIdx !== poolIdx || m.isPlayoff) continue;
    const result = state.results?.[m.id];
    if (!result) continue;
    if (m.team1Id === idA && m.team2Id === idB) return result === 'team1' ? -1 : 1;
    if (m.team1Id === idB && m.team2Id === idA) return result === 'team1' ? 1 : -1;
  }
  return 0;
}

/* ============================================================
   AUTO-SCHEDULER — conflict-free placement
   ============================================================ */
// Pre-pass: schedule Pro-Am events atomically, one flight-round at a time.
// Each Pro-Am flight has 3 rounds; each round has 4 sub-matches that MUST share
// a time slot (4 courts simultaneously). The generic scheduler can't see this
// constraint, so we resolve it here before the main scheduling loop runs.
//
// Stagger strategy (matches how clubs actually run Pro-Am, per the Lobapalooza
// example): each flight occupies one slot per round; flights are placed into
// EARLY slots in order, so Flight 1's Round 1 lands first, then Flight 2's
// Round 1 in the next slot, then Flight 1's Round 2, etc. This naturally
// interleaves flights across the available courts.
//
// Returns a Set of match IDs that were placed by this pass (so the caller can
// filter them out of the main scheduling queue).
function preScheduleProAm(slotMatchCount, slotPlayers, courts) {
  const placed = new Set();
  // Per-flight tracker so each flight's round N goes to a later slot than round N-1.
  // Keyed by flight id; value is { 1: slotIdx, 2: slotIdx, 3: slotIdx }.
  const flightRoundSlots = new Map();

  // Helper: find earliest slot >= minSlot where N matches fit (court count + no
  // player conflicts). Returns -1 if nothing works.
  function findSlotForGroup(matches, minSlot) {
    const groupPlayers = new Set();
    matches.forEach(m => getKnownMatchPlayers(m).forEach(p => groupPlayers.add(p)));
    for (let s = minSlot; s < TIME_SLOTS.length; s++) {
      const used = slotMatchCount[s] || 0;
      if (used + matches.length > courts) continue;
      const sp = slotPlayers[s] || new Set();
      let conflict = false;
      for (const p of groupPlayers) {
        if (sp.has(p)) { conflict = true; break; }
      }
      if (conflict) continue;
      return s;
    }
    return -1;
  }

  // Helper: place a group of matches into the given slot.
  function placeGroup(matches, slotIdx) {
    for (const m of matches) {
      m.slotIdx = slotIdx;
      slotMatchCount[slotIdx] = (slotMatchCount[slotIdx] || 0) + 1;
      if (!slotPlayers[slotIdx]) slotPlayers[slotIdx] = new Set();
      getKnownMatchPlayers(m).forEach(p => slotPlayers[slotIdx].add(p));
      placed.add(m.id);
    }
  }

  // Process flight rounds in interleaved order: all Flight 1 R1, all Flight 2 R1,
  // ..., then R2 for each flight, then R3. This packs flights into consecutive
  // early slots and gives each flight breathing room between its own rounds.
  // We loop by round-then-flight rather than flight-then-round.
  for (let roundNum = 1; roundNum <= 3; roundNum++) {
    for (const ev of state.events) {
      if (ev.format !== 'pro_am') continue;
      if (!ev.flights || ev.flights.length === 0) continue;
      for (const flight of ev.flights) {
        const flightKey = `${ev.id}:${flight.id}`;
        const slotsForFlight = flightRoundSlots.get(flightKey) || {};
        // Round must be in a strictly later slot than the previous round of THIS flight
        const minSlot = roundNum === 1 ? 0 : (slotsForFlight[roundNum - 1] ?? -1) + 1;
        // Collect this round's matches for this flight
        const matches = (ev.matches || []).filter(m =>
          m.proAm && !m.proAm.isFinal &&
          m.proAm.flightId === flight.id &&
          m.proAm.round === roundNum
        );
        if (matches.length === 0) continue;
        const slot = findSlotForGroup(matches, minSlot);
        if (slot === -1) {
          // Couldn't fit — mark these as unscheduled; the TD will see them in
          // the schedule view and can resolve by adding courts or extending days.
          matches.forEach(m => { m._unscheduled = true; placed.add(m.id); });
          continue;
        }
        placeGroup(matches, slot);
        slotsForFlight[roundNum] = slot;
        flightRoundSlots.set(flightKey, slotsForFlight);
      }
    }
  }

  // Schedule the final's 3 rounds. The final has 6 matches (2 per round) for the
  // 2 flight winners. Place them strictly after the latest flight round of the
  // owning event. Player conflicts can't be checked because the participants are
  // TBD until flights complete.
  //
  // IMPORTANT: finals are LOWER priority than flight matches. When schedule
  // capacity is tight, finals get bumped to unscheduled before any flight match
  // does. Real-world Pro-Am tournaments schedule the final "Sunday afternoon
  // TBD" anyway (see Lobapalooza posters: "WINNER OF BRACKET 1 VS WINNER OF
  // BRACKET 2 — TIME TBD"), so leaving finals unscheduled when courts run out
  // matches normal TD practice.
  for (const ev of state.events) {
    if (ev.format !== 'pro_am') continue;
    const finalMatches = (ev.matches || []).filter(m => m.proAm?.isFinal);
    if (finalMatches.length === 0) continue;
    // Latest flight slot for this event
    let maxFlightSlot = -1;
    for (const m of (ev.matches || [])) {
      if (m.proAm && !m.proAm.isFinal && typeof m.slotIdx === 'number') {
        if (m.slotIdx > maxFlightSlot) maxFlightSlot = m.slotIdx;
      }
    }
    // Pro-Am final is a single round with 2 simultaneous sub-matches (Pro/A
    // and B/C). Place them all in one slot strictly after the flight matches
    // finish — find the earliest slot with room for everything.
    let nextSlot = maxFlightSlot + 1;
    while (nextSlot < TIME_SLOTS.length && (slotMatchCount[nextSlot] || 0) + finalMatches.length > courts) {
      nextSlot++;
    }
    if (nextSlot >= TIME_SLOTS.length) {
      finalMatches.forEach(m => { m._unscheduled = true; placed.add(m.id); });
      continue;
    }
    for (const m of finalMatches) {
      m.slotIdx = nextSlot;
      slotMatchCount[nextSlot] = (slotMatchCount[nextSlot] || 0) + 1;
      placed.add(m.id);
    }
  }

  return placed;
}

// Pre-pass for Club Cup events. Groups matches by session (TD-defined, e.g.
// "Saturday AM Doubles"); each session takes a single time slot where its
// matches play simultaneously on different courts. Sessions ordered by their
// position in event.clubCup.sessions, assigned to the earliest available slot
// that (a) fits all the session's matches given court count, and (b) doesn't
// double-book any roster player appearing in multiple matches in the session.
//
// Also assigns courts (1..N) within the session so matches don't share a court.
// This matches how clubs actually run club-vs-club matches: "Saturday morning
// is doubles, we have 4 matches, courts 1-4, go." The TD can override court/
// slot after via the inline dropdowns in the Club Cup editor.
function preScheduleClubCup(slotMatchCount, slotPlayers, courts) {
  const placed = new Set();
  // Track the latest slot used per event, so sessions within an event go
  // sequentially (session 1 → earliest, session 2 → after session 1, etc.)
  const lastSlotPerEvent = new Map();

  for (const ev of state.events) {
    if (ev.format !== 'club_cup') continue;
    const sessions = ev.clubCup?.sessions || [];
    for (const sess of sessions) {
      const sessMatches = (ev.matches || []).filter(m => m.sessionId === sess.id);
      if (sessMatches.length === 0) continue;

      // Find a slot: strictly after this event's last-used slot, where all
      // the session's matches fit under the court cap and don't collide with
      // previously-placed players.
      const minSlot = (lastSlotPerEvent.get(ev.id) ?? -1) + 1;
      const sessPlayers = new Set();
      sessMatches.forEach(m => getKnownMatchPlayers(m).forEach(p => sessPlayers.add(p)));
      let chosen = -1;
      for (let s = Math.max(0, minSlot); s < TIME_SLOTS.length; s++) {
        const used = slotMatchCount[s] || 0;
        if (used + sessMatches.length > courts) continue;
        const sp = slotPlayers[s] || new Set();
        let conflict = false;
        for (const p of sessPlayers) {
          if (sp.has(p)) { conflict = true; break; }
        }
        if (conflict) continue;
        chosen = s;
        break;
      }
      if (chosen === -1) {
        // Session doesn't fit. Mark matches as unscheduled — the TD sees them
        // in the editor and can resolve by adding courts/days or splitting
        // the session.
        sessMatches.forEach(m => { m._unscheduled = true; placed.add(m.id); });
        continue;
      }
      // Place each match in the chosen slot. Assign courts 1..N sequentially,
      // starting after any courts already in use that slot.
      let nextCourt = (slotMatchCount[chosen] || 0) + 1;
      for (const m of sessMatches) {
        m.slotIdx = chosen;
        m.court = nextCourt++;
        slotMatchCount[chosen] = (slotMatchCount[chosen] || 0) + 1;
        if (!slotPlayers[chosen]) slotPlayers[chosen] = new Set();
        getKnownMatchPlayers(m).forEach(p => slotPlayers[chosen].add(p));
        placed.add(m.id);
      }
      lastSlotPerEvent.set(ev.id, chosen);
    }
  }
  return placed;
}
function autoSchedule() {
  let allMatches = [];
  state.events.forEach((ev, idx) => {
    ev.matches.forEach(m => {
      m.slotIdx = undefined;
      m.court = undefined;
      delete m._unscheduled;
      allMatches.push({ m, eventIdx: idx });
    });
  });

  // ============================================================
  // PRO-AM PRE-PASS — schedule Pro-Am flights atomically by round
  // ------------------------------------------------------------
  // Pro-Am rounds need all 4 sub-matches (2 matchups × 2 lines) to play in
  // the same time slot, on 4 adjacent courts — the format requires it. The
  // generic scheduler treats each sub-match independently and prefers spreading
  // matches across slots for court utilization, which scatters Pro-Am rounds.
  // We pre-place each flight's 3 rounds (and the final's 3 rounds) here in
  // atomic groups, then let the main loop handle the rest.
  // ============================================================
  const slotMatchCount = {};  // slotIdx -> int (matches placed there; capped at courts)
  const slotPlayers = {};     // slotIdx -> Set<player>
  const courts = state.tournamentCourts || 6;
  const rules = state.scheduleRules || defaultScheduleRules();
  const enabledDays = getEnabledDays();

  const proAmMatchIds = preScheduleProAm(slotMatchCount, slotPlayers, courts);
  // Filter Pro-Am matches out of the main scheduling queue — they're done.
  allMatches = allMatches.filter(({ m }) => !proAmMatchIds.has(m.id));

  // Club Cup pre-pass: TD-defined sessions, each session takes a time slot
  // with its matches on parallel courts. Same filter-out pattern as Pro-Am.
  const clubCupMatchIds = preScheduleClubCup(slotMatchCount, slotPlayers, courts);
  allMatches = allMatches.filter(({ m }) => !clubCupMatchIds.has(m.id));

  // Compute dependency depth (longest path from any leaf to this match)
  const depthCache = {};
  function loserFeederIds(arr) {
    return (arr || []).map(f => typeof f === 'string' ? f : (f && f.matchId)).filter(Boolean);
  }
  function computeDepth(matchId) {
    if (depthCache[matchId] !== undefined) return depthCache[matchId];
    const m = findMatch(matchId);
    if (!m) return 0;
    const feeders = [
      ...(m.feedsFrom || []).filter(Boolean),
      ...loserFeederIds(m.feedsFromLosers),
    ];

  allMatches.sort((a, b) =>

    a.eventIdx - b.eventIdx ||
    a.m.id.localeCompare(b.m.id)
  );

  // Rule: "1st round of each draw begins at the same time."
  // Default sort packs all of event A's R1s before event B's R1s, so event B's first R1
  // ends up later in the schedule. Interleave R1 matches across events instead — round-robin
  // through events so each event's R1-1 lands in the earliest slot, then everyone's R1-2, etc.
  if (rules.firstRoundsAlign !== false) {

    const others = allMatches.filter(x => x.m._depth !== 0);
    if (r1.length > 0) {
      // Group R1 matches by event index, preserving original order within each group
      const byEvent = new Map();
      for (const x of r1) {
        if (!byEvent.has(x.eventIdx)) byEvent.set(x.eventIdx, []);
        byEvent.get(x.eventIdx).push(x);

      let wave = 0, progress = true;
      while (progress) {
        progress = false;
        for (const evIdx of eventIndices) {
          const ms = byEvent.get(evIdx);
          if (ms[wave]) { interleaved.push(ms[wave]); progress = true; }
        }
        wave++;
      }
      allMatches = [...interleaved, ...others];

  // Compute each match's preferred starting slot (for RR spreading) and allowed range
  // RR spread: distribute event's RR matches across enabled days proportionally
  const rrTargetSlot = new Map();
  if (rules.roundRobinSpread && enabledDays.length > 1) {
    for (const ev of state.events) {
      const rrMatches = ev.matches.filter(mm => ROUND_RR.includes(mm.round));
      if (rrMatches.length < 2) continue;
      // Day boundaries — first slot of each enabled day
      const dayStartIdx = enabledDays.map(d => TIME_SLOTS.findIndex(s => s[0] === d));
      for (let i = 0; i < rrMatches.length; i++) {
        const targetDayIdx = Math.floor((i * enabledDays.length) / rrMatches.length);
        const startSlot = dayStartIdx[targetDayIdx] ?? 0;

  for (const { m } of allMatches) {
    // Start at slot 0 — feeder dependencies (below) push matches later only as needed.
    // Previously used depthSlotBias which artificially delayed SF/F rounds and left courts empty.
    let minSlot = 0;
    let maxSlot = TIME_SLOTS.length - 1;
    // Apply per-round rules (finals on last day, etc.)
    const allowedRange = slotRangeForMatch(m);
    if (allowedRange) {

    }

    // The full recursive walk would treat all possible bracket participants as conflicts,
    // which over-blocks slots — a Final with TBD teams "conflicts" with every other event's
    // match because some of its 16 potential participants might overlap. Real conflicts that
    // emerge as results come in are caught by detectConflicts() and shown in the Schedule view;
    // the scheduler's post-pass below also tries to relocate matches with cross-event overlap.
    const players = getKnownMatchPlayers(m);
    // Compute depth band — within band, prefer less-loaded slots (better spread); outside

    // their pinned target slot as a hard minimum (above) and the band scoring just rewards
    // load balance from there.
    let bandLo = 0, bandHi = TIME_SLOTS.length - 1;
    if (rules.spreadAcrossDays) {
      [bandLo, bandHi] = depthSlotBand(m._depth, TIME_SLOTS.length);
    }

    // Collect ALL feasible slots in [minSlot, maxSlot]: courts cap not exceeded, no known
    // player double-booked. Score each by (band penalty * 100 + slot load); pick lowest.
    // No court assignment — TDs assign courts on-the-fly at the venue.
    const candidates = [];
    for (let s = minSlot; s <= maxSlot; s++) {
      const matchCount = (slotMatchCount[s] || 0);
      if (matchCount >= courts) continue;
      const placedPlayers = slotPlayers[s] || new Set();
      if (players.some(p => placedPlayers.has(p))) continue;
      let bandPenalty = 0;
      if (s < bandLo) bandPenalty = bandLo - s;
      else if (s > bandHi) bandPenalty = s - bandHi;
      const score = bandPenalty * 100 + matchCount;
      candidates.push({ s, score });
    }
    let placed = false;
    if (candidates.length > 0) {
      // Lowest score wins. Tie-break: earlier slot.
      candidates.sort((a, b) => a.score - b.score || a.s - b.s);
      const pick = candidates[0];
      m.slotIdx = pick.s;
      slotMatchCount[pick.s] = (slotMatchCount[pick.s] || 0) + 1;
      if (!slotPlayers[pick.s]) slotPlayers[pick.s] = new Set();
      players.forEach(p => slotPlayers[pick.s].add(p));
      placed = true;
    }
    if (!placed) {
      // Fallback: drop the rule constraint range (except finalsOnLastDay, which stays strict).
      const isFinal = ROUND_FINALS.includes(m.round);
      const fallbackMin = isFinal && rules.finalsOnLastDay ? minSlot : 0;
      const fallbackMax = isFinal && rules.finalsOnLastDay ? maxSlot : TIME_SLOTS.length - 1;
      const fbCandidates = [];
      for (let s = fallbackMin; s <= fallbackMax; s++) {
        if ((slotMatchCount[s] || 0) >= courts) continue;
        const placedPlayers = slotPlayers[s] || new Set();
        if (players.some(p => placedPlayers.has(p))) continue;
        fbCandidates.push({ s, score: (slotMatchCount[s] || 0) });
      }
      if (fbCandidates.length > 0) {
        fbCandidates.sort((a, b) => a.score - b.score || a.s - b.s);
        const pick = fbCandidates[0];
        m.slotIdx = pick.s;
        slotMatchCount[pick.s] = (slotMatchCount[pick.s] || 0) + 1;
        if (!slotPlayers[pick.s]) slotPlayers[pick.s] = new Set();
        players.forEach(p => slotPlayers[pick.s].add(p));
        placed = true;
      }
    }
    if (!placed) {
      m.slotIdx = null;
      m._unscheduled = true;

}
function rowsToEntries(table, override){
  const rows = table.map(r => (r || []).map(c => c == null ? '' : String(c).trim())).filter(r => r.some(Boolean));
  if (!rows.length) return {entries:[], map:null, header:null, table:rows};
  let hi = -1, map = null;
  for (let i = 0; i < Math.min(rows.length, 12); i++){ const m = mapHeader(rows[i]); if (m){ hi = i; map = m; break } }
  if (!map && !override){ const g = inferMap(rows); if (g){ hi = g.hi; map = g.map } }
  if (override){ hi = override.hi; map = override.map }
  // A "Flight"/"Division" column holding only Pro, A, B, C is a level, not an event
  if (map && map.event != null && map.rating == null){ const vals = rows.slice(hi + 1).map(r => r[map.event]).filter(Boolean); if (vals.length && vals.every(v => parseLevel(v).tier)){ map.rating = map.event; delete map.event } }
  const entries = [];
  if (!map){
    // No header: each row is "name, rating, M/F, ..." or a team line
    rows.forEach(r => parsePasteEntries(r.filter(Boolean).join(r.some(c => / \/ /.test(c)) ? ' ' : ', ')).forEach(e => entries.push(e)));
    return {entries, map:null, header:null, table:rows};
  }
  const get = (r, k) => map[k] != null ? (r[map[k]] || '') : '';
  const hdr = k => map[k] != null && hi >= 0 ? String(rows[hi][map[k]] || '').toLowerCase() : '';
  const sexOf = h => /\b(man|men|male|gentleman|his|husband)\b/.test(h) ? 'M' : /\b(woman|women|female|lady|ladies|her|wife)\b/.test(h) ? 'F' : '';
  for (const r of rows.slice(hi + 1)){
    let name = get(r, 'name') || [get(r, 'first'), get(r, 'last')].filter(Boolean).join(' ');
    let pname2 = get(r, 'p2name') || [get(r, 'p2first'), get(r, 'p2last')].filter(Boolean).join(' ');
    // "Jane Doe / John Doe" in a single name cell is a team
    if (!pname2 && /\s\/\s|\s&\s/.test(name)){ const [x, y] = name.split(/\s\/\s|\s&\s/); name = x; pname2 = y }
    name = name.replace(/\s+/g, ' ').trim(); pname2 = pname2.replace(/\s+/g, ' ').trim();
    if (!name || /^(total|name|player)$/i.test(name)) continue;
    const lv = parseLevel(get(r, 'rating'));
    const a = {name, rating:lv.rating ?? null, tier:lv.tier || '', gender:parseGender(get(r, 'gender')) || sexOf(hdr('name') || hdr('first')), email:get(r, 'email'), phone:get(r, 'phone'), club:get(r, 'club')};
    const e = {a, events:get(r, 'event') ? get(r, 'event').split(/\s*[,;|\n]\s*|\s+\+\s+/).filter(Boolean) : []};
    if (pname2){
      const lv2 = parseLevel(get(r, 'p2rating'));
      e.b = {name:pname2, rating:lv2.rating ?? null, tier:lv2.tier || '', gender:parseGender(get(r, 'p2gender')) || sexOf(hdr('p2name') || hdr('p2first')), email:get(r, 'p2email'), phone:get(r, 'p2phone'), club:get(r, 'club')};
      // One rating on a team row: a "Team rating" column, or a number too big to be one player's, is the pair's combined rating
      let tr = parseLevel(get(r, 'teamrating')).rating ?? null;
      if (tr == null && e.b.rating == null && a.rating != null && a.rating > TEAM_RATING_OVER()){ tr = a.rating; a.rating = null }
      if (tr != null) e.teamRating = tr;
    }
    entries.push(e);
  }
  return {entries, map, header:hi >= 0 ? rows[hi] : rows[0].map((_, i) => 'Column ' + (i + 1)), hi, table:rows};
}

/* ---------- Reading files ---------- */
async function readTables(file){
  const name = file.name.toLowerCase();
  if (/\.(csv|tsv|txt)$/.test(name)){
    const text = await file.text();
    if (/\.txt$/.test(name) && !/[\t,]/.test(text.split('\n').slice(0, 5).join(''))) return [text.split(/\r?\n/).map(l => [l])];
    await loadScript(LIBS.xlsx);
    const wb = XLSX.read(text, {type:'string', raw:false});
    return wb.SheetNames.map(n => XLSX.utils.sheet_to_json(wb.Sheets[n], {header:1, raw:false, defval:''}));
  }
  if (/\.(xlsx|xlsm|xls|ods|numbers)$/.test(name)){
    await loadScript(LIBS.xlsx);
    const wb = XLSX.read(await file.arrayBuffer(), {type:'array'});
    return wb.SheetNames.map(n => XLSX.utils.sheet_to_json(wb.Sheets[n], {header:1, raw:false, defval:''}));
  }
  if (/\.docx$/.test(name)){
    await loadScript(LIBS.mammoth);
    const html = (await mammoth.convertToHtml({arrayBuffer:await file.arrayBuffer()})).value;
    const doc = new DOMParser().parseFromString(html, 'text/html');
    const tables = [...doc.querySelectorAll('table')].map(t => [...t.querySelectorAll('tr')].map(tr => [...tr.querySelectorAll('td,th')].map(td => td.textContent.trim())));
    if (tables.length) return tables;
    return [[...doc.querySelectorAll('p,li')].map(p => [p.textContent.trim()]).filter(r => r[0])];
  }
  if (/\.pdf$/.test(name)){
    await loadScript(LIBS.pdf);
    window.pdfjsLib.GlobalWorkerOptions.workerSrc = LIBS.pdfWorker;
    const pdf = await window.pdfjsLib.getDocument({data:await file.arrayBuffer()}).promise, rows = [];
    for (let i = 1; i <= Math.min(pdf.numPages, 30); i++){
      const items = (await (await pdf.getPage(i)).getTextContent()).items.filter(t => t.str.trim());
      const lines = new Map();
      items.forEach(t => { const y = Math.round(t.transform[5] / 3); if (!lines.has(y)) lines.set(y, []); lines.get(y).push({x:t.transform[4], w:t.width, s:t.str.trim()}) });
      [...lines.entries()].sort((a, b) => b[0] - a[0]).forEach(([, its]) => {
        its.sort((a, b) => a.x - b.x); const cells = []; let last = null;
        its.forEach(t => { if (last && t.x - (last.x + last.w) < 6) cells[cells.length - 1] += ' ' + t.s; else cells.push(t.s); last = t });
        rows.push(cells);
      });
    }
    return [rows];
  }
  throw new Error("That file type isn't supported. Use Excel, CSV, Word (.docx) or PDF.");
}
async function readRosterFile(file){
  const tables = await readTables(file);
  // Pick the sheet/table that yields the most people
  let best = {entries:[]};
  for (const t of tables){ const r = rowsToEntries(t); if (r.entries.length > best.entries.length) best = r }
  return best;
}

function guessEvent(name){
  const k = name.toLowerCase(), lv = (name.match(/(\d+(?:\.\d+)?)/) || [])[1];
  const t = {name:name.trim(), kind:/mixed|\bmx\b|\bxd\b/.test(k) ? 'mixed' : /single/.test(k) ? 'singles' : /pro.?am/.test(k) ? 'proam' : 'doubles',
    gender:/women|ladies|\bwd\b|\bws\b|girls|female/.test(k) ? 'F' : /\bmen|\bmd\b|\bms\b|boys|male|gentlemen/.test(k) ? 'M' : '', format:'single_elim_cons'};
  if (t.kind === 'mixed'){ t.gender = 'X'; if (lv) t.cap = parseFloat(lv) }
  else if (t.kind === 'proam') t.format = 'pro_am';
  else if (lv && parseFloat(lv) <= 10) t.level = parseFloat(lv);
  return t;
}
function planImport(entries){
  const evs = events(), known = new Map(evs.map(e => [evKey(e.name), e])), newEvents = new Map();
  let people = 0, teams = 0;
  entries.forEach(e => { people += e.b ? 2 : 1; if (e.b) teams++; (e.events || []).forEach(n => { const k = evKey(n); if (k && !known.has(k) && !newEvents.has(k)) newEvents.set(k, n.trim()) }) });
  return {people, teams, existing:[...new Set(entries.flatMap(e => (e.events || []).map(evKey)).filter(k => known.has(k)).map(k => known.get(k).name))], newEvents:[...newEvents.values()]};
}
function applyImport(entries, opts){
  opts = opts || {};
  const rows = []; entries.forEach(e => { rows.push(e.a); if (e.b) rows.push(e.b) });
  const r = addPlayers(rows);
  const pl = players().slice(), id = n => (findByName(n, pl) || {}).id;
  // partner links on the roster, so any event pairs them together
  entries.forEach(e => { if (!e.b) return; const a = findByName(e.a.name, pl), b = findByName(e.b.name, pl); if (a && b){ a.partnerId = b.id; b.partnerId = a.id; if (e.teamRating != null){ a.teamRating = b.teamRating = e.teamRating } } });
  savePlayers(pl);
  const evs = evsCopy(), byKey = new Map(evs.map(ev => [evKey(ev.name), ev]));
  let made = 0, entered = 0;
  const target = opts.eventId ? evs.find(ev => ev.id === opts.eventId) : null;
  entries.forEach(e => {
    const names = target ? [target.name] : (e.events || []);
    names.forEach(n => {
      let ev = target || byKey.get(evKey(n));
      if (!ev){ ev = newEvent(guessEvent(n)); evs.push(ev); byKey.set(evKey(n), ev); made++ }
      if (hasResults(ev)) return;
      const ids = [id(e.a.name), e.b ? id(e.b.name) : null].filter(Boolean);
      ids.forEach(x => { if (!ev.entrants.includes(x)){ ev.entrants.push(x); entered++ } });
      if (ids.length === 2 && KINDS[ev.kind].size === 2 && !ev.pairs.some(t => t.includes(ids[0]) || t.includes(ids[1]))) ev.pairs.push(ids);
    });
  });
  saveEvents(evs);
  inferFromEvents();
  return Object.assign(r, {made, entered});
}

    if (b.status === 'live' && out) finishBet(b, out, true);

  if (me && ALERTS.bets) bets().forEach(b => { const was = before.bets[b.id]; if (was === b.status) return; if (b.status === 'pending' && !was && betNeedsMe(b, me)) alertOut('bets', `${pname(b.by)} posted a ${money(b.amt)} bet: ${betDesc(b)}`, 'bet:' + b.id); if (b.status === 'settled' && (b.by === me || b.to === me)) alertOut('bets', b.push ? `Push: ${betDesc(b)}` : `${b.winner === me ? 'You won' : 'You lost'} ${money(b.amt)}: ${betDesc(b)}`, 'bet:' + b.id); if (b.status === 'live' && was === 'pending' && b.by === me) alertOut('bets', `${pname(b.to)} took your bet: ${betDesc(b)}`, 'bet:' + b.id) });

function photos(){
  const own = Store.keys('photo:').map(k => Object.assign({k}, Store.get(k))).filter(p => p && p.url);
  const linked = new Set(own.map(p => p.chat).filter(Boolean));
  const fromChat = Store.keys('chat:').map(k => Object.assign({k, chat:k}, Store.get(k))).filter(m => m && m.img && !linked.has(m.k)).map(m => ({k:m.k, url:m.img, by:m.by, name:m.name, ts:m.ts, caption:m.text || '', likes:[], fromChat:true}));
  return own.concat(fromChat).sort((a, b) => b.ts - a.ts);
}

function crestSvg(s){ return `<img class="logo brandmark" src="${s > 90 ? BRAND_HERO : BRAND_CREST}" width="${s}" height="${s}" alt="Bracketly">` }
function crest(s){ const c = cfg() || {}; if (pic(c, 'logo')) return `<img class="logo" src="${pic(c, 'logo')}" width="${s}" height="${s}" alt="">`; return crestSvg(s) }
const datesLabel = () => { const ds = dayRows(); if (!ds.length) return ''; const a = ds[0].date, b = ds[ds.length - 1].date; return a === b ? dayLabel(a) : `${dayLabel(a)} – ${dayLabel(b)}` };
const tsub = () => [datesLabel(), (cfg() || {}).club].filter(Boolean).join(' · ');

/* ---------- Shell ---------- */
function syncPill(){
  if (Store.mode !== 'live') return '';
  const n = Store.pending();
  if (!Store.online) return `<span class="sync off">Offline${n ? `, ${n} saved on phone` : ''}</span>`;
  if (n) return `<span class="sync">Syncing ${n}</span>`;
  return '<span class="live-dot"></span>';
}
/* ---------- Shell (Phase 1 redesign): brand row, tournament context, five-position player nav ---------- */
function header(){
  const dir = view.tab === 'admin', home = view.tab === 'today', un = unreadCount();
  const bell = `<button class="hbtn v3-ring" data-act="alerts" aria-label="Notifications${un ? `, ${un} unread chat message${un === 1 ? '' : 's'}` : ''}">${ICON.bell}${un ? '<i class="v3-dot" aria-hidden="true"></i>' : ''}</button>`;
  const more = `<button class="hbtn more v3-ring" data-act="tab" data-v="more" aria-label="More">${ICON.more}</button>`;
  return `<header class="top bk-top v3-top ${home ? 'tall' : ''}">
    ${hdrImg()}
    <div class="v3-top-row">
      ${dir ? '<span class="v3-top-side"></span>' : `<span class="v3-top-side">${bell}</span>`}
      <button class="bk-brand v3-brand" data-act="tab" data-v="today" aria-label="Bracketly home for ${esc(tripTitle())}"><img class="logo brandmark v3-logo" src="${BRAND_HERO}" width="${home ? 92 : 46}" height="${home ? 92 : 46}" alt=""></button>
      <span class="v3-top-side end">${syncPill()}${dir ? `<button class="bk-hpill" data-act="tab" data-v="today">Return to tournament</button>` : more}</span>
    </div>
    ${home ? '<p class="v3-tagline" aria-hidden="true"><i></i>Tennis. Pickleball. Together.<i></i></p>' : ''}
  </header>`;
}
const hdrImg = () => TRIP && cfg() && brand().header ? `<img class="v3-top-bg" src="${esc(brand().header)}" alt="" aria-hidden="true" decoding="async">` : `<img class="v3-top-bg" src="${IMG_HEADER}" srcset="${imgSet('court-header')}" sizes="100vw" alt="" aria-hidden="true" decoding="async">`;
/* ---------- v3 reusable pieces: status badge, tournament card, scoreboard, match card ---------- */
function tripStatus(c){
  c = c || cfg() || {}; const ds = (c.days || []).filter(d => d.on !== false).map(d => d.date).sort();
  const today = isoDay(new Date()), a = ds[0] || c.start, b = ds[ds.length - 1] || c.end || a;
  if (!a) return {k:'upcoming', label:'Upcoming'};
  if (b && today > b) return {k:'done', label:'Completed'};
  if (today >= a) return {k:'live', label:'Live event'};
  return {k:'upcoming', label:'Upcoming'};
}
const v3Badge = st => `<span class="v3-badge ${st.k}">${st.k === 'live' ? '<i class="st-dot" aria-hidden="true"></i>' : ''}${esc(st.label)}</span>`;
function v3SecHead(title, id, link){ return `<div class="v3-sechead"><h2 class="v3-h2" id="${id}">${esc(title)}</h2>${link || ''}</div>` }
function tournamentCard(){
  const c = cfg() || {}, cover = pic(c, 'cover'), st = tripStatus(c), np = players().length;
  const tile = (v, label, icon) => `<button class="v3-tile" data-act="tab" data-v="${v}">${ICON[icon]}<span>${label}</span></button>`;
  return `<article class="v3-tcard" aria-labelledby="tc-h">
    <div class="v3-tcard-ph">${cover ? `<img src="${cover}" alt="" loading="lazy">` : `<img src="${IMG_HERO}" srcset="${imgSet('court-hero')}" sizes="(min-width:740px) 700px, 100vw" alt="" loading="lazy" decoding="async">`}
      <div class="v3-tcard-ov">
        <div class="v3-tcard-top">${v3Badge(st)}</div>
        <h1 class="v3-tcard-h" id="tc-h">${esc(tripTitle())}</h1>
        ${c.club ? `<p class="v3-tcard-club">${esc(c.club)}</p>` : ''}
        <p class="v3-tcard-meta">${datesShort() ? `<span>${ICON.cal}${esc(datesShort())}</span>` : ''}${np ? `<span>${ICON.people}${np} Player${np === 1 ? '' : 's'}</span>` : ''}</p>
      </div></div>
    <nav class="v3-tiles" aria-label="Tournament pages">${tile('draws', 'Draws', 'draws')}${tile('schedule', 'Schedule', 'schedule')}${tile('courts', 'Courts', 'courts')}${tile('info', 'Info', 'info')}</nav>
  </article>`;
}
/* Team cup standings for a Club Cup event, or a short tournament summary when there's no team scoring */
function v3Scoreboard(){
  const cup = state.events.find(e => e.format === 'club_cup' && e.clubCup && e.matches.length && (e.published || view.admin));
  if (cup){
    const cc = cup.clubCup, t = getClubCupTotals(cup);
    const mid = cc.pointsToWin ? `${fmtPts(cc.pointsToWin)} to win` : `${t.matchesComplete} of ${t.matchesTotal} played`;
    return `<button class="v3-board" data-act="openev" data-id="${esc(cup.id)}" aria-label="${esc(`${cup.name}: ${cc.teamAName} ${fmtPts(t.sideA)}, ${cc.teamBName} ${fmtPts(t.sideB)}. ${mid}${t.winner ? `. ${t.winner === 'A' ? cc.teamAName : cc.teamBName} win` : ''}`)}">
      <span class="v3-board-side"><small>${esc(cc.teamAName)}</small><b>${fmtPts(t.sideA)}</b></span>
      <span class="v3-board-mid">${ICON.trophy}<em>${/cup/i.test(cup.name) ? 'Team Cup' : esc(cup.name)}</em><small>${t.winner ? esc((t.winner === 'A' ? cc.teamAName : cc.teamBName) + ' win') : esc(mid)}</small></span>
      <span class="v3-board-side"><small>${esc(cc.teamBName)}</small><b>${fmtPts(t.sideB)}</b></span></button>`;
  }
  if (brand().clubBoard){ const cb = clubBoardHtml(); if (cb) return cb }
  const evs = state.events.filter(e => (e.published || view.admin) && e.matches.length); if (!evs.length) return '';
  const ms = evs.flatMap(e => e.matches), done = ms.filter(m => state.results[m.id] && resOf(m.id)).length, live = liveNow().length;

/* Placement changes recorded by "Move match" (Phase 3). Older matches have no record, so no label. */
function movedInfo(m){
  const mv = m && m.moved; if (!mv || !mv.from || state.results[m.id]) return null;
  const tChg = mv.from.when !== m.when, cChg = mv.from.court !== m.court;
  if (!tChg && !cChg) return null;
  const was = [tChg && mv.from.when ? slotKeyLabel(mv.from.when) : '', cChg && mv.from.court ? courtName(mv.from.court) : ''].filter(Boolean).join(' · ');
  return {label:tChg && cChg ? 'Time and court changed' : tChg ? 'Time changed' : 'Court changed', was};
}
function slotKeyLabel(k){ const i = SLOT_KEYS.indexOf(k); if (i >= 0 && TIME_SLOTS[i]) return `${TIME_SLOTS[i][0].split(',')[0]} ${TIME_SLOTS[i][1]}`; const d = String(k || ''); return d ? `${dayLabel(d.slice(0, 10))} ${fmtClock(d.slice(11))}` : '' }
const movedNote = m => { const x = movedInfo(m); return x ? `<p class="bk-note warn"><b>${esc(x.label)}.</b>${x.was ? ` Was ${esc(x.was)}.` : ''}</p>` : '' };

function courtBoard(){
  syncEngine();
  const n = state.tournamentCourts, ms = allMatches(true), now = Date.now();
  const tiles = [];
  for (let c = 1; c <= n; c++){
    const here = ms.filter(m => m.court === c && TIME_SLOTS[m.slotIdx]).sort((a,b) => a.slotIdx - b.slotIdx);
    const cur = here.find(m => ['live','now'].includes(matchStatus(m, now))) || null;
    const nxt = here.find(m => m !== cur && !state.results[m.id] && slotDate(m.slotIdx) && slotDate(m.slotIdx).getTime() > now - 15*60000 && matchStatus(m, now) !== 'live');
    tiles.push({c, cur, nxt});
  }
  return tiles;
}

function eventSummary(ev){

  return `${n} ${ev.kind === 'singles' || ev.kind === 'clubcup' ? 'players' : 'teams'} · ${esc(FORMAT_LABELS[ev.format] || '')}${ev.format === 'pro_am' ? ' · games won' : ' · ' + esc((SCORING_FORMATS[(ev.scoring || {}).main] || {}).shortLabel || '')}`;

function eventDraw(ev, print){
  if (!ev.matches.length) return '<p class="bk-empty">Not drawn yet.</p>';
  if (ev.format === 'round_robin') return rrView(ev, null, print);
  if (ev.format === 'multi_pool') return poolsView(ev, print);
  if (ev.format === 'pro_am') return proAmView(ev, print);

  return elimView(ev, print);
}
function sectionOf(r){ if (/^GF/.test(r)) return 'gf'; if (/^W/.test(r)) return 'w'; if (/^L/.test(r)) return 'l'; if (/^C/.test(r)) return 'c'; return 'main' }
const SECTION_TITLES = {main:'Main draw', w:'Winners bracket', l:'Losers bracket', gf:'Grand final', c:'Consolation'};
const ROUND_TABS = {QF:'Quarters', SF:'Semis', F:'Final', CSF:'Cons semis', CF:'Cons final', GF:'Grand final'};
function roundsOf(ms){ const rounds = []; ms.forEach(m => { let r = rounds.find(x => x.r === m.round); if (!r){ r = {r:m.round, ms:[]}; rounds.push(r) } r.ms.push(m) }); return rounds }
function bracketCols(ms, print){
  const rounds = roundsOf(ms);
  return `<div class="bracket ${print ? 'pr' : ''}">${rounds.map(r => `<div class="bcol"><div class="bh">${esc(longLabel(r.r))}</div><div class="bms">${r.ms.map(m => bmatch(m, print)).join('')}</div></div>`).join('')}</div>`;
}
function bmatch(m, print){
  const st = matchStatus(m), t = TIME_SLOTS[m.slotIdx];
  if (print) return `<div class="bm ${st}">${teamLine(m, 'team1')}${teamLine(m, 'team2')}<div class="bf">${st === 'done' ? esc(scoreText(m)) : st === 'bye' ? 'Bye' : st === 'live' || st === 'now' ? `<b>On ${esc(courtName(m.court))}</b>` : t ? `${esc(t[0].split(',')[0])} ${esc(t[1])} · ${esc(courtName(m.court))}` : ''}</div></div>`;
  return matchRow(m, {noEvent:true, noRound:true});
}
function elimView(ev, print){
  const secs = {}; ev.matches.filter(m => m.poolIdx == null || m.isPlayoff).forEach(m => { const s = sectionOf(m.round); (secs[s] = secs[s] || []).push(m) });
  const order = ['main', 'w', 'l', 'gf', 'c'].filter(s => secs[s]);
  if (print) return order.map(s => `${order.length > 1 ? `<h3>${SECTION_TITLES[s]}</h3>` : ''}${bracketCols(secs[s], print)}`).join('');
  const key = view.dsec && view.dsec.ev === ev.id && secs[view.dsec.s] ? view.dsec.s : order[0];
  const ms = secs[key], rounds = roundsOf(ms), fmt = (getScoringFormat(ms[0]) || {}).label || '';

  const toggle = tree => `<button class="bk-link" data-act="dtree" data-ev="${esc(ev.id)}">${tree ? 'Show one round at a time' : 'View full bracket'} <span aria-hidden="true">→</span></button>`;
  if (view.dtree === ev.id) return `${secTabs}<h2 class="bk-h2">${SECTION_TITLES[key]}</h2><div class="bk-scrollx" role="region" aria-label="${esc(SECTION_TITLES[key])}, full bracket. Scrolls sideways." tabindex="0">${bracketCols(ms)}</div>${fmt ? `<p class="bk-meta" style="margin-top:12px">${esc(fmt)}</p>` : ''}${toggle(true)}`;
  const defR = (rounds.find(r => r.ms.some(m => !['done', 'bye'].includes(matchStatus(m)))) || rounds[rounds.length - 1]).r;
  const rk = view.dround && view.dround.ev === ev.id && view.dround.s === key && rounds.some(r => r.r === view.dround.r) ? view.dround.r : defR;
  const cur = rounds.find(r => r.r === rk);
  return `${secTabs}
  ${rounds.length > 1 ? `<div class="seg2 rounds" role="group" aria-label="Round">${rounds.map(r => `<button data-act="dround" data-ev="${esc(ev.id)}" data-s="${key}" data-v="${esc(r.r)}" aria-pressed="${r.r === rk}">${esc(ROUND_TABS[r.r] || longLabel(r.r))}</button>`).join('')}</div>` : ''}
  <h2 class="bk-h2">${esc(longLabel(rk))}</h2>
  ${cur.ms.map(m => matchRow(m, {noEvent:true, noRound:true})).join('')}
  ${fmt ? `<p class="bk-meta" style="margin-top:12px">${esc(fmt)}</p>` : ''}
  ${toggle(false)}`;
}
function rrStandings(ev, ms){
  const teams = new Map(), rec = t => { if (!teams.has(t.id)) teams.set(t.id, {team:t, W:0, L:0, sw:0, sl:0, gw:0, gl:0}); return teams.get(t.id) };
  ms.forEach(m => { const a = m.team1Id && findTeam(m.team1Id), b = m.team2Id && findTeam(m.team2Id); if (a) rec(a); if (b) rec(b) });
  ms.forEach(m => {
    const w = state.results[m.id], a = m.team1Id && findTeam(m.team1Id), b = m.team2Id && findTeam(m.team2Id);
    if (!w || !a || !b) return;
    const ra = rec(a), rb = rec(b); if (w === 'team1'){ ra.W++; rb.L++ } else { rb.W++; ra.L++ }
    (state.scores[m.id] || []).forEach(r => { if (!Array.isArray(r) || r[0] == null || r[1] == null) return; ra.gw += r[0]; ra.gl += r[1]; rb.gw += r[1]; rb.gl += r[0]; if (r[0] > r[1]){ ra.sw++; rb.sl++ } else if (r[1] > r[0]){ rb.sw++; ra.sl++ } });
  });
  return [...teams.values()].sort((x, y) => y.W - x.W || (y.sw - y.sl) - (x.sw - x.sl) || (y.gw - y.gl) - (x.gw - x.gl) || (x.team.seed || 0) - (y.team.seed || 0));
}
function standingsTable(rows){

}
function rrView(ev, poolIdx, print){
  const ms = ev.matches.filter(m => poolIdx == null ? true : (m.poolIdx === poolIdx && !m.isPlayoff));
  const rounds = roundsOf(ms);
  return `${standingsTable(rrStandings(ev, ms))}${print ? '' : rounds.map(r => `<h3 class="bk-group">${esc(longLabel(r.r))}</h3>${r.ms.map(m => matchRow(m, {noEvent:true, noRound:true})).join('')}`).join('')}`;
}
function poolsView(ev, print){
  const pools = [...new Set(ev.matches.filter(m => m.poolIdx != null && !m.isPlayoff).map(m => m.poolIdx))].sort((a, b) => a - b);
  const po = ev.matches.filter(m => m.isPlayoff);
  return pools.map(p => `<h2 class="bk-h2">Pool ${String.fromCharCode(65 + p)}</h2>${rrView(ev, p, print)}`).join('') + (po.length ? `<h2 class="bk-h2">Playoff</h2>${print ? bracketCols(po, print) : `<div class="bk-scrollx" role="region" aria-label="Playoff bracket. Scrolls sideways." tabindex="0">${bracketCols(po)}</div>`}` : '');
}
function proAmView(ev, print){

    const ms = ev.matches.filter(m => m.proAm && m.proAm.flightId === f.id);

/* ================= Entry lists grouped by division =================
   Women's 2.5
   Jessica McFall / Rebekah Phillips
   ...
   Mixed 7.0
   Ali Hamilton / Kerry Thompson
   The header sets the event, the level and M/F, so nobody needs a rating picked by hand. */
const pairKey = pids => pids.slice().sort().join('.');
// A team entered under a division header counts at that division's level
const evTeamRating = (ev, pids) => { const v = ((ev || {}).teamLv || {})[pairKey(pids)]; return v != null ? v : teamRating(pids) };
const evTeamRated = (ev, pids) => ((ev || {}).teamLv || {})[pairKey(pids)] != null || allRated(pids);
function cleanEntryName(n){
  let s = String(n || '').replace(/\(.*?\)/g, ' ').replace(/[\u2018\u2019]/g, "'").replace(/\s+/g, ' ').trim();
  const cut = /(\u2026|\.\.\.)$/.test(s) || /\(.*cut.*\)/i.test(n);
  s = s.replace(/(\u2026|\.\.\.)$/, '').trim();
  return {name:s, cut};
}
const isDivisionHeader = line => {
  const t = line.replace(/[\u2018\u2019]/g, "'").trim();
  if (!t || /[\/&]|\s+and\s+/i.test(t) || t.length > 40) return false;
  return /^(men'?s|women'?s|ladies'?|mixed|open|boys'?|girls'?|junior|senior|singles|doubles|pro.?am|[mwx][sd]\b|\d\.\d)/i.test(t) || /\b(open|\d\.\d)\s*(doubles|singles)?$/i.test(t);
};
function parseDivisionList(text){
  const lines = String(text || '').split(/\r?\n/).map(l => l.replace(/^\s*[-•*\d]+[.)]?\s+(?=[A-Za-z])/, '').trim()).filter(Boolean);
  const divs = []; let cur = null, loose = 0;
  for (const raw of lines){
    if (/^no (teams|players|entries)( listed| yet)?\.?$/i.test(raw)) continue;
    if (isDivisionHeader(raw)){ cur = {name:raw.replace(/[\u2018\u2019]/g, "'").replace(/:$/, '').trim(), teams:[], solo:[], cut:[]}; divs.push(cur); continue }
    if (!cur){ loose++; continue }
    const parts = raw.split(/\s*\/\s*|\s+&\s+|\s+and\s+/i).map(cleanEntryName).filter(x => x.name);
    parts.forEach(x => { if (x.cut) cur.cut.push(x.name) });
    if (parts.length >= 2) cur.teams.push(parts.slice(0, 2).map(x => x.name)); else if (parts.length === 1) cur.solo.push(parts[0].name);

}
/* Work out ratings and M/F from the divisions before anything is saved */
function planDivisionList(parsed){
  const plan = parsed.divs.map(d => ({d, tpl:guessEvent(d.name)}));
  plan.forEach(x => { if (x.d.solo.length && !x.d.teams.length) x.tpl.kind = 'singles' });
  const sex = new Map(), rate = new Map(), key = n => normName(n), know = (n, v, map) => { if (v != null && v !== '' && !map.has(key(n))) map.set(key(n), v) };
  plan.forEach(({d, tpl}) => { if (tpl.gender === 'M' || tpl.gender === 'F') [...d.teams.flat(), ...d.solo].forEach(n => know(n, tpl.gender, sex)) });
  plan.forEach(({d, tpl}) => { if (tpl.kind !== 'mixed' && tpl.level) [...d.teams.flat(), ...d.solo].forEach(n => know(n, tpl.level, rate)) });
  // also use what the roster already knows
  [...new Set(plan.flatMap(x => [...x.d.teams.flat(), ...x.d.solo]))].forEach(n => { const p = findByName(n); if (p){ if (p.gender) know(n, p.gender, sex) } });
  for (let pass = 0; pass < 3; pass++) plan.forEach(({d, tpl}) => { if (tpl.kind !== 'mixed') return; d.teams.forEach(([a, b]) => { const ga = sex.get(key(a)), gb = sex.get(key(b)); if (ga && !gb) sex.set(key(b), ga === 'M' ? 'F' : 'M'); if (gb && !ga) sex.set(key(a), gb === 'M' ? 'F' : 'M') }) });
  const names = [...new Set(plan.flatMap(x => [...x.d.teams.flat(), ...x.d.solo]).map(n => n.trim()))];
  const unique = []; names.forEach(n => { if (!unique.some(u => key(u) === key(n))) unique.push(n) });
  const unknownSex = unique.filter(n => plan.some(x => x.tpl.kind === 'mixed' && x.d.teams.flat().some(m => key(m) === key(n))) && !sex.get(key(n)));
  // likely the same person typed two ways (Zach / Zachary Mulkey)
  const dupes = [];
  for (let i = 0; i < unique.length; i++) for (let j = i + 1; j < unique.length; j++){ const a = key(unique[i]).split(' '), b = key(unique[j]).split(' '); if (a.length > 1 && b.length > 1 && a[a.length - 1] === b[b.length - 1] && a[0] !== b[0] && (a[0].startsWith(b[0]) || b[0].startsWith(a[0]))) dupes.push([unique[i], unique[j]]) }
  const evs = events();
  plan.forEach(x => { x.existing = evs.find(e => evKey(e.name) === evKey(x.d.name)) || evs.find(e => e.kind === x.tpl.kind && (e.gender || '') === (x.tpl.gender || '') && (e.level || null) === (x.tpl.level || null) && (e.cap || null) === (x.tpl.cap || null)) || null });
  return {plan, sex, rate, unique, unknownSex, dupes, cut:plan.flatMap(x => x.d.cut)};
}
function rosterJunk(keepNames){

  const keep = new Set((keepNames || []).map(normName));
  return players().filter(p => !inEv.has(p.id) && !keep.has(normName(p.name)) && (
    /^(men'?s?|women'?s?|ladies|mixed|open|boys|girls|singles|doubles)( |$)/i.test(p.name.replace(/[\u2018\u2019]/g, "'")) && normName(p.name).split(' ').length <= 3 ||
    /^no (teams|players|entries)/i.test(p.name) ||
    (/\(|\u2026|\.\.\.$/.test(p.name) && keep.has(normName(cleanEntryName(p.name).name)))));
}
function applyDivisionList(parsed){
  const P2 = planDivisionList(parsed), key = n => normName(n);
  { const junk = new Set(rosterJunk(P2.unique).map(p => p.id)); if (junk.size) savePlayers(players().filter(p => !junk.has(p.id)).map(p => { if (junk.has(p.partnerId)) delete p.partnerId; return p })) }
  addPlayers(P2.unique.map(n => { const r = {name:n}, ex = findByName(n); const g = P2.sex.get(key(n)), rt = P2.rate.get(key(n)); if (g && !(ex && ex.gender)) r.gender = g; if (rt != null && !(ex && (ex.rating != null || ex.tier))) r.rating = rt; return r }));

/* Anyone entered in an event takes that event's M/F and level when they don't already have one:
   men's/women's events set M/F, a 3.5 event sets 3.5, a Mixed 7.0 team counts as 7.0, and a
   mixed partner gets the opposite M/F of the other. Existing ratings and tags are never changed. */
function inferFromEvents(){
  if (!TRIP || !cfg() || !view.admin) return;
  const pl = players(), evs = events(), byId = new Map(pl.map(p => [p.id, p])); let chP = false, chE = false;
  evs.forEach(e => {
    if (!e.name) return; const g = guessEvent(e.name);
    if (['doubles', 'singles'].includes(e.kind)){
      if (g.kind === 'mixed' && !isDrawn(e)){ e.kind = 'mixed'; e.gender = 'X'; if (g.cap && !e.cap) e.cap = g.cap; chE = true; return }
      if (!e.gender && (g.gender === 'M' || g.gender === 'F')){ e.gender = g.gender; chE = true }
      if (e.level == null && g.level){ e.level = g.level; chE = true }
    }
    if (e.kind === 'mixed' && e.cap == null && g.cap){ e.cap = g.cap; chE = true }

  const members = e => [...new Set([...(e.entrants || []), ...(e.pairs || []).flat()].filter(Boolean))];
  evs.forEach(e => { if (e.gender === 'M' || e.gender === 'F') members(e).forEach(id => { const p = byId.get(id); if (p && !p.gender){ p.gender = e.gender; chP = true } }) });
  for (let pass = 0; pass < 3; pass++) evs.forEach(e => { if (e.kind !== 'mixed') return; (e.pairs || []).forEach(t => { if (t.length !== 2) return; const a = byId.get(t[0]), b = byId.get(t[1]); if (!a || !b) return;
    if (a.gender && !b.gender){ b.gender = a.gender === 'M' ? 'F' : 'M'; chP = true } else if (b.gender && !a.gender){ a.gender = b.gender === 'M' ? 'F' : 'M'; chP = true } }) });
  evs.forEach(e => { if (e.level && ['doubles', 'singles'].includes(e.kind)) members(e).forEach(id => { const p = byId.get(id); if (p && p.rating == null && !p.tier){ p.rating = e.level; chP = true } }) });
  if (chP) savePlayers(pl);
  evs.forEach(e => { if (e.kind !== 'mixed' || !e.cap) return; (e.pairs || []).forEach(t => { if (t.filter(Boolean).length !== 2) return; const k = pairKey(t); e.teamLv = e.teamLv || {}; if (e.teamLv[k] == null && !allRated(t)){ e.teamLv[k] = e.cap; chE = true } }) });
  if (chE) saveEvents(evs);
}

/* ================= Setup flow: Event → Players → Bracket ================= */
const WZ_STEPS = [['basics','Tournament'], ['events','Events'], ['players','Players'], ['bracket','Brackets'], ['courts','Courts & times'], ['schedule','Schedule'], ['welcome','Welcome page'], ['customize','Customize'], ['share','Share']];

/* ---------- Step 2: events ---------- */

}

      ${nd.kind !== 'mixed' ? `<div class="seg" style="margin-top:6px">${[['M','Men'],['F','Women'],['','Anyone']].map(([k, l]) => `<button class="${nd.gender === k ? 'on' : ''}" data-act="ndset" data-f="gender" data-v="${k}">${l}</button>`).join('')}</div>` : ''}
      <label class="small muted" style="margin-top:6px;display:block">${nd.kind === 'mixed' ? 'Combined level' : 'Level'}</label>
      ${isTennis() ? `<div class="seg lvls">${[['', 'Open'], ...(nd.kind === 'mixed' ? TEAM_LEVELS.X : TEAM_LEVELS.M).map(x => [String(x), (nd.kind === 'mixed' ? 'Mixed ' : '') + x.toFixed(1)])].map(([k, l]) => `<button class="${String(nd.level) === k ? 'on' : ''}" data-act="ndset" data-f="level" data-v="${k}">${l}</button>`).join('')}</div>` : `<input id="nd-level" inputmode="decimal" placeholder="Open" value="${esc(nd.level || '')}">`}
