<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#123C2F">
<meta name="color-scheme" content="light only">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="Bracketly">
<meta name="description" content="Draws, live courts, scores and chat for tennis and pickleball tournaments.">
<link rel="manifest" href="manifest.webmanifest">
<link rel="apple-touch-icon" href="apple-touch-icon.png">
<link rel="icon" type="image/png" href="icon-192.png">
<title>Bracketly</title>
<link rel="preconnect" href="https://fonts.googleapis.com"><link rel="preconnect" href="https://fonts.gstatic.com" crossorigin><link href="https://fonts.googleapis.com/css2?family=Playfair+Display:wght@600;700;800&family=Inter:wght@400;500;600;700&family=Fraunces:opsz,wght@9..144,500;9..144,700;9..144,900&family=Manrope:wght@400;500;600;700&family=Big+Shoulders+Display:wght@600;700;800;900&family=IBM+Plex+Mono:wght@400;500;600&family=Libre+Caslon+Text:ital,wght@0,400;0,700;1,400&display=swap" rel="stylesheet">
<style>
:root{--ink:#1B2B36;--ink2:#2B3F4D;--paper:#E8EBE3;--card:#F7F8F4;--line:#C9CFC3;--muted:#4A565C;--gold-ink:#7A5B12;--gold:#B8923A;--gold2:#DDBE6A;--A:#A3242C;--B:#1D3F73;--r:10px}
*{box-sizing:border-box}
:root{color-scheme:light only}
html,body{margin:0;background:var(--paper)!important;color:var(--ink)!important;font:400 16px/1.45 var(--fb);-webkit-font-smoothing:antialiased}
html,body{height:100%;overflow:hidden;overscroll-behavior:none}
#app{background:var(--paper);color:var(--ink);height:100vh;height:100dvh;display:flex;flex-direction:column;overflow:hidden}
#scroller{flex:1 1 auto;min-height:0;overflow-y:auto;-webkit-overflow-scrolling:touch;overscroll-behavior:contain}
#app > header.top,#app > nav.tabs,#app > .composer{flex:0 0 auto}
a{color:inherit}
button,input,select,textarea{font:inherit;color:inherit}
button{cursor:pointer;background:none;border:0;padding:0}
:focus-visible{outline:3px solid var(--gold);outline-offset:2px}
img.logo{object-fit:contain;display:block}
h2{font:700 24px/1.1 var(--fd);margin:26px 0 10px}
h3{font:700 19px/1.1 var(--fd);margin:18px 0 8px}
.muted{color:var(--muted)}
.small{font-size:13.5px}
.wrap{max-width:740px;margin:0 auto;padding:14px 16px 30px}

header.top{position:relative;z-index:30;background:var(--ink);color:#fff;display:flex;align-items:center;justify-content:space-between;gap:10px;padding:10px 14px;padding-top:calc(10px + env(safe-area-inset-top))}
.brand{display:flex;gap:10px;align-items:center;min-width:0}
.tname{font:700 23px/1 var(--fd);letter-spacing:.01em;white-space:nowrap}
.tsub{font-size:12.5px;color:#B6C2C8;margin-top:3px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.hright{display:flex;gap:8px;align-items:center}
.me{width:36px;height:36px;border-radius:50%;background:var(--c);color:var(--co,#fff);font:700 15px/36px var(--fd);text-align:center;border:2px solid rgba(255,255,255,.7)}
.icon{width:36px;height:36px;border-radius:50%;display:grid;place-items:center;color:#D8E0E4}
.icon svg{width:22px;height:22px}
.sync{display:inline-block;background:var(--gold);color:#1B1B14;font:600 11.5px/1.5 var(--fb);padding:0 7px;border-radius:999px;margin-right:6px}
.sync.off{background:#C2453A;color:#fff}
.live-dot{width:8px;height:8px;border-radius:50%;background:#7FBF8E;display:inline-block;margin-right:5px;vertical-align:1px}

nav.tabs{position:relative;z-index:30;background:var(--ink);display:grid;grid-template-columns:repeat(5,1fr);padding-bottom:env(safe-area-inset-bottom)}
nav.tabs button{color:#93A2AA;padding:9px 0 8px;display:flex;flex-direction:column;align-items:center;gap:2px;font:600 12px var(--fb)}
nav.tabs button svg{width:24px;height:24px}
nav.tabs button.on{color:#fff}
nav.tabs button.on svg{color:var(--gold2)}
nav.tabs .badge{position:absolute;margin-left:22px;margin-top:-2px;background:var(--A);color:#fff;font:700 11px/16px var(--fb);min-width:16px;height:16px;border-radius:8px;padding:0 4px}
svg.i{fill:none;stroke:currentColor;stroke-width:1.8;stroke-linecap:round;stroke-linejoin:round}

/* Scoreboard */
.sb{background:var(--ink);color:#fff;border-radius:14px;padding:18px 12px 14px;position:relative;overflow:hidden}
.sb::before{content:"";position:absolute;inset:0;background:repeating-linear-gradient(90deg,transparent 0 22px,rgba(255,255,255,.025) 22px 23px);pointer-events:none}
.sbgrid{display:grid;grid-template-columns:1fr auto 1fr;gap:8px;align-items:end;position:relative}
.sbteam{display:flex;flex-direction:column;align-items:center;gap:8px}
.sbteam .tm{font:700 21px/1 var(--fd);text-align:center}
.tile{background:#F3F4EE;color:var(--ink);font:800 78px/1 var(--fd);min-width:118px;text-align:center;padding:10px 10px 4px;border-radius:5px;border-top:7px solid var(--c);box-shadow:inset 0 -7px 0 rgba(0,0,0,.07),0 2px 0 rgba(0,0,0,.35);font-variant-numeric:tabular-nums}
.sbmid{text-align:center;color:#AEBBC2;font-size:13px;padding-bottom:18px;min-width:64px}
.sbmid b{display:block;font:800 30px/1 var(--fd);color:var(--gold2)}
.bar{position:relative;height:8px;border-radius:4px;background:#3A4E5C;margin:16px 4px 8px;overflow:hidden}
.bar i{position:absolute;top:0;bottom:0}
.bar .mk{position:absolute;top:-3px;bottom:-3px;left:50%;width:2px;background:var(--gold2)}
.sbfoot{position:relative;text-align:center;font-size:13px;color:#AEBBC2}

/* Round tabs */
.rtabs{display:flex;gap:8px;overflow-x:auto;padding:14px 0 4px;scrollbar-width:none}
.rtabs::-webkit-scrollbar{display:none}
.rtab{flex:0 0 auto;border:1px solid var(--line);background:var(--card);border-radius:10px;padding:8px 12px;text-align:left;min-width:118px}
.rtab b{display:block;font:700 18px/1.05 var(--fd)}
.rtab span{font-size:12.5px;color:var(--muted)}
.rtab.on{background:var(--ink);color:#fff;border-color:var(--ink)}
.rtab.on span{color:#B6C2C8}
.howto{font-size:14px;color:var(--muted);margin:8px 2px 12px}

/* Match rows */
.mrow{display:grid;grid-template-columns:1fr auto 1fr;align-items:center;gap:8px;background:var(--card);border:1px solid var(--line);border-radius:var(--r);padding:10px;margin-bottom:8px;width:100%;text-align:left}
.side{display:flex;flex-direction:column;gap:1px;font-weight:600;font-size:15px;line-height:1.2;min-width:0}
.side span{overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.side.a{border-left:4px solid var(--A);padding-left:8px}
.side.b{border-right:4px solid var(--B);padding-right:8px;text-align:right}
.side.won{font-weight:700}
.side.lost{color:var(--muted);font-weight:500}
.chip{font:700 15px/1.1 var(--fd);padding:6px 10px;border-radius:8px;background:var(--slot);color:var(--ink);text-align:center;min-width:96px}
.chip small{display:block;font:500 11.5px/1.2 var(--fb);opacity:.85;margin-top:1px}
.chip.lead{background:var(--c);color:var(--co,#fff)}

/* Tables */
.tbl{width:100%;border-collapse:collapse;font-size:15px;background:var(--card);border:1px solid var(--line);border-radius:var(--r);overflow:hidden}
.tbl th{font:600 12.5px var(--fb);color:var(--muted);text-align:left;padding:8px;border-bottom:1px solid var(--line)}
.tbl td{padding:8px;border-bottom:1px solid var(--rule)}
.tbl tr:last-child td{border-bottom:0}
.tbl .n{text-align:right;font-variant-numeric:tabular-nums}
.dot{display:inline-block;width:9px;height:9px;border-radius:50%;background:var(--c);margin-right:6px}

.card{background:var(--card);border:1px solid var(--line);border-radius:var(--r);padding:14px;margin-bottom:10px}
.btn{background:var(--ink);color:#fff;border-radius:9px;padding:10px 16px;font-weight:600}
.btn.alt{background:transparent;color:var(--ink);border:1.5px solid var(--ink)}
.btn.gold{background:var(--gold);color:#1B1B14}
.btn.danger{background:#8E2A22}
.btn.sm{padding:6px 11px;font-size:14px}
.btn:disabled{opacity:.45;cursor:default}
.row{display:flex;gap:8px;flex-wrap:wrap;align-items:center}
.ghost{color:#D8E0E4;border:1px solid #4A5E6B;border-radius:8px;padding:6px 10px;font-size:14px}

/* Scoring */
.strip{display:flex;gap:6px;overflow-x:auto;padding:4px 0 10px;scrollbar-width:none}
.strip::-webkit-scrollbar{display:none}
.strip button{flex:0 0 36px;height:36px;border-radius:50%;border:1.5px solid var(--line);background:var(--card);font:700 15px var(--fd)}
.strip button.done{background:var(--ink2);color:#fff;border-color:var(--ink2)}
.strip button.wa{background:var(--A);border-color:var(--A);color:var(--A-on)}
.strip button.wb{background:var(--B);border-color:var(--B);color:var(--B-on)}
.strip button.on{outline:3px solid var(--gold);outline-offset:1px}
.holehero{display:flex;align-items:flex-end;justify-content:space-between;background:var(--ink);color:#fff;border-radius:14px;padding:12px 16px}
.holehero .num{font:800 88px/.85 var(--fd)}
.holehero .num small{font:600 16px var(--fb);color:#AEBBC2;display:block;margin-bottom:4px}
.holehero .meta{text-align:right;font:600 15px/1.5 var(--fb)}
.holehero .meta b{font:800 34px/1 var(--fd);display:block}
.mstat{margin:10px 0;text-align:center}
.ent{display:flex;align-items:center;justify-content:space-between;gap:10px;background:var(--card);border:1px solid var(--line);border-left:5px solid var(--c);border-radius:var(--r);padding:10px 10px 10px 12px;margin-bottom:8px}
.ent .en b{display:block;font-size:17px;line-height:1.2}
.ent .en span{font-size:13px;color:var(--muted)}
.ent .en .gets{color:var(--c);font-weight:700}
.step{display:flex;align-items:center;gap:6px}
.step button{width:46px;height:46px;border-radius:12px;background:var(--slot);font:600 26px/1 var(--fb);touch-action:manipulation}
.step button:active{background:#C8CFC1}
.val{width:52px;height:52px;display:grid;place-items:center;font:800 30px/1 var(--fd);position:relative}
.val.empty{color:#66727A}
.net{font-size:12px;color:var(--muted);text-align:center;margin-top:-4px}
/* scorecard symbols: circle = under par, square = over par */
.s-b::after,.s-e::after,.s-e::before,.s-o::after,.s-d::after,.s-d::before{content:"";position:absolute;inset:6px;border:2px solid currentColor;pointer-events:none}
.s-b::after,.s-e::after,.s-e::before{border-radius:50%}
.s-e::before{inset:1px}
.s-d::before{inset:1px}
.holeres{text-align:center;font:700 17px var(--fd);margin:6px 0 12px;min-height:22px}
.navrow{display:grid;grid-template-columns:1fr 1fr;gap:8px}

.sc-wrap{overflow-x:auto;border:1px solid var(--line);border-radius:var(--r);background:var(--card)}
.sc{border-collapse:collapse;font-size:14px;min-width:100%}
.sc th,.sc td{padding:6px 4px;text-align:center;min-width:30px;border-bottom:1px solid var(--rule)}
.sc th:first-child,.sc td:first-child{text-align:left;position:sticky;left:0;background:var(--card);min-width:118px;padding-left:10px;font-weight:600;white-space:nowrap;max-width:140px;overflow:hidden;text-overflow:ellipsis}
.sc .tot{background:var(--paper);font-weight:700}
.sc .cell{position:relative;display:inline-grid;place-items:center;width:28px;height:28px;font-weight:600}
.sc .cell.s-b::after,.sc .cell.s-o::after{inset:1px}
.sc .cell.s-e::after,.sc .cell.s-d::after{inset:3px}
.sc .cell.s-e::before,.sc .cell.s-d::before{inset:-1px}
.sc sup{color:var(--gold-ink);font-size:9px;position:absolute;top:-2px;right:-3px}
.sc .w-a{background:var(--A);color:var(--A-on)}
.sc .w-b{background:var(--B);color:var(--B-on)}
.sc .w-h{background:var(--rule)}

/* Bets */
.bet{background:var(--card);border:1px solid var(--line);border-radius:var(--r);padding:12px;margin-bottom:8px}
.bet .top{display:flex;justify-content:space-between;gap:10px;align-items:baseline}
.bet .amt{font:800 26px/1 var(--fd)}
.bet .desc{font-weight:600}
.pill{display:inline-block;font:600 12px var(--fb);padding:2px 8px;border-radius:999px;background:var(--slot);color:var(--ink)}
.pill.win{background:#2F6B47;color:#fff}
.pill.loss{background:#8E2A22;color:#fff}
.form label{display:block;font-size:13px;font-weight:600;color:var(--muted);margin:10px 0 4px}
.form select,.form input,.form textarea,.adm input,.adm select,.adm textarea{width:100%;padding:9px 10px;border:1px solid var(--line);border-radius:8px;background:var(--slot)}
.seg{display:grid;grid-template-columns:repeat(auto-fit,minmax(90px,1fr));gap:6px}
.seg button{border:1.5px solid var(--line);border-radius:8px;padding:8px 6px;background:var(--slot);font-weight:600;font-size:14px}
.seg button.on{background:var(--ink);color:#fff;border-color:var(--ink)}
.ledger li{display:flex;justify-content:space-between;padding:8px 0;border-bottom:1px solid var(--rule)}
.ledger{list-style:none;margin:0;padding:0}

/* Chat */
.chat{display:flex;flex-direction:column;gap:8px;padding-bottom:12px}
.msg{max-width:84%;align-self:flex-start}
.msg.mine{align-self:flex-end}
.msg .who{font-size:12.5px;color:var(--muted);margin:0 4px 2px}
.msg.mine .who{text-align:right}
.bub{background:var(--card);border:1px solid var(--line);border-radius:14px 14px 14px 4px;padding:8px 12px;word-wrap:break-word}
.msg.mine .bub{background:var(--ink);color:#fff;border-color:var(--ink);border-radius:14px 14px 4px 14px}
.bub img{display:block;max-width:100%;border-radius:8px;margin:4px 0}
.bub .at{font-weight:700;color:var(--gold-ink)}
.msg.mine .bub .at{color:var(--gold2)}
.reacts{display:flex;gap:4px;flex-wrap:wrap;margin-top:3px}
.msg.mine .reacts{justify-content:flex-end}
.reacts button{font-size:13px;padding:1px 7px;border-radius:999px;border:1px solid var(--line);background:var(--card)}
.reacts button.on{border-color:var(--gold);background:var(--slot)}
.reacts .add{color:var(--muted)}
.auto{align-self:center;max-width:92%;text-align:center;font:600 15px var(--fd);letter-spacing:.01em;color:var(--ink);border-top:2px solid var(--gold);border-bottom:2px solid var(--gold);padding:5px 12px;background:var(--slot)}
.auto .t{font:500 11.5px var(--fb);color:var(--muted);display:block}
.composer{position:relative;z-index:25;background:var(--paper);border-top:1px solid var(--line);padding:8px 10px}
.composer .in{max-width:740px;margin:0 auto;display:flex;gap:8px;align-items:center}
.composer input[type=text]{flex:1;padding:11px 14px;border-radius:22px;border:1px solid var(--line);background:var(--slot)}
.composer label{width:42px;height:42px;border-radius:50%;display:grid;place-items:center;background:var(--slot);cursor:pointer}
.composer label svg{width:22px;height:22px}
.composer .send{background:var(--ink);color:#fff;border-radius:22px;padding:10px 16px;font-weight:600}
.preview{max-width:740px;margin:0 auto 6px;display:flex;align-items:center;gap:8px}
.preview img{height:56px;border-radius:6px}

/* Admin */
.adm .grid2{display:grid;grid-template-columns:1fr 1fr;gap:8px}
.adm .grid3{display:grid;grid-template-columns:2fr 1fr 1fr auto;gap:6px;align-items:center;margin-bottom:6px}
.adm .holes{display:grid;grid-template-columns:repeat(9,1fr);gap:4px;font-size:12px}
.adm .holes input{padding:6px 2px;text-align:center}
.adm .pairing{display:grid;grid-template-columns:1fr auto 1fr;gap:6px;align-items:center;margin-bottom:8px}
.adm .pairing .vs{font:700 14px var(--fd);color:var(--muted)}
.adm .pairing .col{display:flex;flex-direction:column;gap:4px}
.adm pre{background:var(--ink);color:#E6ECEF;padding:12px;border-radius:8px;overflow-x:auto;font-size:12.5px}
.logo-up{display:flex;align-items:center;gap:10px;margin:6px 0}
.logo-up label{cursor:pointer}

.modal{position:fixed;inset:0;z-index:50;background:rgba(15,25,32,.6);display:flex;align-items:flex-end;justify-content:center}
.sheet{background:var(--paper);width:100%;max-width:560px;max-height:86vh;overflow:auto;border-radius:16px 16px 0 0;padding:18px 16px calc(18px + env(safe-area-inset-bottom))}
.who-grid{display:grid;grid-template-columns:1fr 1fr;gap:6px}
.who-grid button{background:var(--card);border:1px solid var(--line);border-left:5px solid var(--c);border-radius:8px;padding:10px;text-align:left;font-weight:600}
#toast{position:fixed;left:50%;transform:translateX(-50%);bottom:calc(90px + env(safe-area-inset-bottom));background:var(--ink);color:#fff;padding:10px 16px;border-radius:10px;font-size:14px;z-index:60;opacity:0;transition:opacity .2s;pointer-events:none;max-width:90vw}
#toast.on{opacity:1}
.empty-state{text-align:center;padding:30px 10px;color:var(--muted)}
/* Home */
.cover{display:block;width:calc(100% + 28px);margin:-14px -14px 14px;max-height:240px;object-fit:cover}
.hello{font:700 30px/1.05 var(--fd);margin:6px 0 12px}
.next{background:var(--ink);color:#fff;border-radius:14px;padding:16px;position:relative;overflow:hidden;border-left:7px solid var(--c)}
.next .lbl{font-size:13px;color:#AEBBC2}
.next .when{font:800 64px/.95 var(--fd);margin:4px 0 6px;font-variant-numeric:tabular-nums}
.next .when small{font:600 18px var(--fd);color:var(--gold2);margin-left:8px}
.next .what{font:700 22px/1.15 var(--fd)}
.next .det{color:#C9D3D8;font-size:14.5px;margin-top:6px;line-height:1.5}
.next .btn{margin-top:12px}
.next.hero{text-align:center;padding:22px 16px 18px;border-left:0;border-top:7px solid var(--c)}
.next.hero .badge{display:flex;justify-content:center;margin-bottom:12px}
.next.hero .badge img,.next.hero .badge svg{width:128px;height:128px;border-radius:50%;object-fit:contain;background:#F3F4EE}
.next.hero .when{font-size:56px;margin:6px 0 4px}
.next.hero .when small{display:block;margin:4px 0 0}
.next.hero .det{max-width:440px;margin:8px auto 0}
.me-row{display:grid;grid-template-columns:1fr 1fr;gap:8px;margin:10px 0 0}
.me-row button,.me-row div{background:var(--card);border:1px solid var(--line);border-radius:var(--r);padding:10px;text-align:left}
.me-row b{display:block;font:700 22px/1.1 var(--fd)}
.me-row span{font-size:13px;color:var(--muted)}
.alert{background:var(--slot);border:1px solid var(--gold);border-radius:var(--r);padding:10px 12px;margin-top:10px;display:flex;justify-content:space-between;align-items:center;gap:10px;width:100%;text-align:left;font-weight:600}
.day{margin-top:20px}
.dayh{display:flex;justify-content:space-between;align-items:baseline;border-bottom:2px solid var(--ink);padding-bottom:4px}
.dayh b{font:700 23px var(--fd)}
.dayh span{font-size:13px;color:var(--muted)}
.it{display:grid;grid-template-columns:68px 1fr;gap:10px;padding:11px 0;border-bottom:1px solid var(--rule)}
.it .tm{font:700 17px/1.25 var(--fd);color:var(--muted)}
.it .bd b{display:block;font-size:16.5px}
.it .bd span{display:block;font-size:14px;color:var(--muted)}
.it .bd a{color:var(--ink);font-size:13.5px}
.it.golf .bd{border-left:4px solid var(--c);padding-left:10px}
.it.past{opacity:.72}
.it.now .tm{color:var(--gold-ink)}
.it .chip{display:inline-block;margin-top:6px;min-width:0}
.evcard .grid2{margin-bottom:6px}
.checks{display:grid;grid-template-columns:1fr 1fr;gap:4px;font-size:14px;margin-top:6px}
.checks label{display:flex;gap:6px;align-items:center}
.checks input{width:auto}
/* Draft */
.next .clock{position:absolute;right:16px;top:14px;font:800 46px/1 var(--fd);font-variant-numeric:tabular-nums}
.next .clock.low{color:#FF8A7A}
.dorder{display:flex;gap:4px;overflow-x:auto;padding:12px 0 4px;scrollbar-width:none}
.dorder::-webkit-scrollbar{display:none}
.dorder span{flex:0 0 38px;height:38px;border-radius:6px;background:transparent;border:2px solid var(--c);color:var(--ink);font:700 13px/34px var(--fd);text-align:center}
.dorder span.done{background:var(--c);color:var(--co,#fff)}
.dorder span.on{outline:3px solid var(--gold);outline-offset:1px;background:var(--slot)}
.rosters{display:grid;grid-template-columns:1fr 1fr;gap:8px}
.roster{background:var(--card);border:1px solid var(--line);border-top:6px solid var(--c);border-radius:var(--r);padding:10px}
.roster .rh{display:flex;align-items:center;gap:8px;font:700 19px/1 var(--fd)}
.roster ol{margin:8px 0 0;padding:0;list-style:none;font-size:14.5px}

.wx{display:grid;grid-template-columns:repeat(3,1fr);gap:8px}
.wxc{background:var(--card);border:1px solid var(--line);border-radius:var(--r);padding:10px 6px;text-align:center}

/* ===== Yardage Book + hand-hung scoreboard theme ===== */
:root{--paper:#EFE8D8;--card:#F6F1E4;--slot:#FAF5EA;--ink:#2A2620;--ink2:#3A342C;--line:#2A2620;--rule:#B5A98F;--muted:#6B6152;--green:#1B2A4A;--green2:#142038;--gold:#B8923A;--gold2:#DDBE6A;--gold-ink:#7A5B12;--red:#A52A23;--blue:#234C82}
body,#app{font-family:var(--fb)}
.small,.muted.small,.tsub,.lbl,.howto,.net,.who,.pencil{font-family:var(--fm)}
.small{font-size:12.5px}
h2,h3{font-family:var(--fd);letter-spacing:.04em;text-transform:uppercase}
header.top{background:var(--green);border-bottom:3px solid var(--ink)}
.tname{font:900 25px/1 var(--fd);letter-spacing:.06em;text-transform:uppercase}
.tsub{color:var(--onp2);font-size:10.5px;letter-spacing:.06em;text-transform:uppercase}
.me{border-color:var(--onp);font-family:var(--fd)}
.icon{color:var(--onp)}
nav.tabs{background:var(--card);border-top:1.5px solid var(--ink)}
nav.tabs button{color:var(--muted);font:500 10.5px var(--fm)}
nav.tabs button.on{color:var(--ink);font-weight:600}
nav.tabs button.on svg{color:var(--green)}
.card,.mrow,.ent,.bet,.roster,.av,.rtab,.wxc,.tbl,.sc-wrap,.who-grid button,.alert{background:var(--card);border:1.5px solid var(--ink);border-radius:4px}
.tbl th{font-family:var(--fm);color:var(--muted);border-bottom:1.5px solid var(--ink)}
.tbl td{border-bottom:1px dashed var(--rule)}
.btn{background:var(--green);color:var(--onp);border-radius:3px;font:600 14px var(--fm);letter-spacing:.02em}
.btn.alt{background:var(--card);color:var(--ink);border:1.5px solid var(--ink)}
.btn.gold{background:var(--gold);color:#1B1B14}
.btn.danger{background:var(--red)}
.ghost{border-color:var(--onp2);color:var(--onp)}
.seg button{border:1.5px solid var(--ink);border-radius:3px;background:var(--card);font-family:var(--fm)}
.seg button.on{background:var(--green);border-color:var(--green);color:var(--onp)}
.rtab{border-radius:4px}
.rtab b{font-family:var(--fd);letter-spacing:.04em;text-transform:uppercase}
.rtab span{font-family:var(--fm);font-size:11px}
.rtab.on{background:var(--green);border-color:var(--ink);color:var(--onp)}
.rtab.on span{color:var(--onp2)}
/* hand-hung scoreboard */
.sb{background:var(--green);border:3px solid var(--ink);border-radius:5px}
.sb::before{background:none}
.sbteam .tm{font-family:var(--fd);letter-spacing:.08em;text-transform:uppercase;color:var(--onp)}
.tile{background:var(--slot);color:var(--c);border:2px solid var(--ink);border-top:2px solid var(--ink);border-radius:2px;font-family:var(--fd);font-weight:900;box-shadow:inset 0 -6px 0 rgba(0,0,0,.08)}
.sbmid{color:var(--onp2);font-family:var(--fm);font-size:11px}
.sbmid b{color:var(--onp);font-family:var(--fd)}
.bar{background:var(--green2);border:1.5px solid var(--ink)}
.bar .mk{background:var(--onp)}
.sbfoot{color:var(--onp2);font-family:var(--fm);font-size:11.5px}
.side{font-family:var(--fd);font-size:16px;letter-spacing:.04em;text-transform:uppercase}
.side.lost{color:var(--muted)}
.chip{background:var(--slot);border:1.5px solid var(--ink);border-radius:2px;font-family:var(--fd);letter-spacing:.04em;box-shadow:inset 0 -3px 0 rgba(0,0,0,.07)}
.chip small{font-family:var(--fm)}
.chip.lead{border-color:var(--ink)}
/* rosters */
.roster{border-top:6px solid var(--c)}
.roster .rh{font-family:var(--fd);letter-spacing:.06em;text-transform:uppercase}
.roster li{border-bottom:1px dashed var(--rule)}
/* next-up card: paper card with the badge on top */
.next{background:var(--card);color:var(--ink);border:1.5px solid var(--ink);border-radius:4px}
.next.hero{border-top:6px solid var(--green)}
.next .lbl{color:var(--muted);font-size:11px;letter-spacing:.08em;text-transform:uppercase}
.next .when{font-family:var(--fd);font-weight:900}
.next .when small{color:var(--gold-ink);font-family:var(--fm);font-size:13px;font-weight:500}
.next .what{font-family:var(--fb);font-style:italic;font-weight:400;font-size:19px}
.next .det{color:var(--ink2);font-family:var(--fm);font-size:12.5px;line-height:1.6;border-top:1px dashed var(--rule);padding-top:8px}
.next.hero .badge img,.next.hero .badge svg{background:transparent;object-fit:cover}
img.logo{border-radius:50%;object-fit:cover}
.next .clock{color:var(--ink)}
.next .clock.low{color:var(--red)}
.hello{font-family:var(--fd);letter-spacing:.04em;text-transform:uppercase}
.me-row b{font-family:var(--fd)}
.alert{background:var(--card)}
/* score entry */
.strip button{border-radius:3px;border:1.5px solid var(--ink);background:var(--slot);font-family:var(--fd)}
.strip button.done{background:var(--ink2);border-color:var(--ink2);color:var(--onp)}
.strip button.on{outline:2px solid var(--green)}
.holehero{background:var(--card);color:var(--ink);border:1.5px solid var(--ink);border-radius:4px}
.holehero .num small,.holehero .meta{color:var(--muted);font-family:var(--fm)}
.holehero .meta b{color:var(--ink);font-family:var(--fd)}
.ent{border-left:6px solid var(--c)}
.ent .en b{font-family:var(--fb)}
.ent .en span{font-family:var(--fm);font-size:11.5px}
.step button{background:var(--card);border:1.5px solid var(--ink);border-radius:3px;font-family:var(--fm)}
.val{background:var(--slot);border:1.5px solid var(--ink);border-radius:2px;font-family:var(--fd);box-shadow:inset 0 -3px 0 rgba(0,0,0,.07)}
.val.s-b,.val.s-e,.cell.s-b,.cell.s-e{color:var(--red)}
.holeres{font-family:var(--fb);font-style:italic;font-weight:400}
/* chat */
.bub{background:var(--card);border:1.5px solid var(--ink)}
.msg.mine .bub{background:var(--green);border-color:var(--ink);color:var(--onp)}
.auto{background:transparent;border-top:1px dashed var(--ink);border-bottom:1px dashed var(--ink);font-family:var(--fm);font-size:12.5px;font-weight:500}
.composer{background:var(--card);border-top:1.5px solid var(--ink)}
.composer input[type=text]{border:1.5px solid var(--ink);border-radius:3px;background:var(--slot)}
.composer .send{background:var(--green);border-radius:3px;font-family:var(--fm)}
.composer label{background:var(--card);border:1.5px solid var(--ink);border-radius:3px}
/* weather, gate, modal */
.wxc b{font-family:var(--fd);letter-spacing:.04em;text-transform:uppercase}
.wxc .t{font-family:var(--fd)}
.wxc span{font-family:var(--fm);font-size:11px}
.gate h1{font-family:var(--fd);letter-spacing:.06em;text-transform:uppercase}
.sheet{background:var(--paper)}
.pill{background:var(--slot);border:1px solid var(--ink);font-family:var(--fm)}
.form select,.form input,.form textarea,.adm input,.adm select,.adm textarea,.sgrow select,.sgrow input,.pinbox{border:1.5px solid var(--ink);border-radius:3px;background:var(--slot)}
img.cover{border-bottom:1.5px solid var(--ink)}
.side span{white-space:normal;overflow:visible}
.side{font-size:15px;line-height:1.15}
.seg{grid-template-columns:repeat(auto-fit,minmax(68px,1fr))}
.focus{flex:1 1 auto;min-height:0;display:flex;flex-direction:column}
.ftop{background:var(--green);color:var(--onp);display:flex;justify-content:space-between;align-items:center;gap:10px;padding:calc(10px + env(safe-area-inset-top)) 14px 10px;border-bottom:3px solid var(--ink)}
.ftop b{display:block;font:900 22px/1 var(--fd);letter-spacing:.05em;text-transform:uppercase}
.ftop span{font:400 11px var(--fm);color:var(--onp2)}
.ftop select{font:500 11px var(--fm);background:var(--green2);color:var(--onp);border:1px solid var(--onp2);border-radius:3px;padding:1px 4px}
.fbar{display:grid;grid-template-columns:1fr 1fr;gap:8px;padding:8px 12px calc(10px + env(safe-area-inset-bottom));background:var(--card);border-top:1.5px solid var(--ink)}
.fbar button{padding:12px 8px;border:1.5px solid var(--ink);border-radius:3px;background:var(--slot);font:600 14px var(--fm);color:var(--ink)}
.fbadge{display:inline-block;background:var(--red);color:#fff;border-radius:9px;min-width:18px;padding:0 5px;font-size:12px;line-height:18px}
.uprow{display:flex;justify-content:space-between;align-items:center;gap:10px;padding:8px 0;border-bottom:1px dashed var(--rule);font-size:14px}
.upcup{display:grid;grid-template-columns:1fr auto 1fr;align-items:center;text-align:center;margin:8px 0 6px;padding:8px;border:1.5px solid var(--ink);border-radius:4px;background:var(--card)}
.upcup b{display:block;font:900 34px/1 var(--fd)}
.upcup span{font:500 11px var(--fm);text-transform:uppercase}
.fchat{display:flex;flex-direction:column;max-height:80vh}
.flist{flex:1;overflow-y:auto;margin:8px 0;display:flex;flex-direction:column;gap:6px}
.fmsg{background:var(--card);border:1.5px solid var(--ink);border-radius:4px;padding:6px 10px;font-size:14.5px;align-self:flex-start;max-width:90%}
.fmsg.mine{align-self:flex-end;background:var(--green);color:var(--onp)}
.fmsg.auto{align-self:center;background:transparent;border:0;border-top:1px dashed var(--ink);border-bottom:1px dashed var(--ink);border-radius:0;font:500 12px var(--fm)}
.fin{display:flex;gap:8px}
.fin input{flex:1;padding:11px 12px;border:1.5px solid var(--ink);border-radius:3px;background:var(--slot)}
/* Trip page: day picker, big board, rest-of-day rail */
.tdays{display:flex;gap:6px;margin:4px 0 10px}
.tdays button{flex:1;border:1.5px solid var(--ink);background:var(--slot);border-radius:3px;padding:6px 0;font:900 17px/1.1 var(--fd);letter-spacing:.06em;text-transform:uppercase;color:var(--ink)}
.tdays button small{display:block;font:400 10px var(--fm);letter-spacing:0;color:var(--muted);text-transform:none}
.tdays button.on{background:var(--green);color:var(--onp)}
.tdays button.on small{color:var(--onp2)}
.tboard{background:var(--green);border:3px solid var(--ink);border-radius:5px;padding:16px 14px 14px;color:var(--onp);text-align:center}
.tboard .tlogo{display:flex;justify-content:center;margin-bottom:8px}
.tboard .tlogo img,.tboard .tlogo svg{width:116px;height:116px;border-radius:50%;object-fit:cover}
.tboard .lbl{font:500 11px var(--fm);letter-spacing:.08em;text-transform:uppercase;color:var(--onp2)}
.tboard .ttime{font:900 50px/1 var(--fd);margin:4px 0 2px}
.tboard .twhat{font:italic 400 18px var(--fb)}
.ttags{display:flex;flex-wrap:wrap;justify-content:center;gap:4px;margin:8px 0 0}
.ttags span{font:500 9px/1.6 var(--fm);letter-spacing:.05em;text-transform:uppercase;border:1px solid var(--onp2);border-radius:999px;padding:0 7px;color:var(--onp2)}
.tfacts{display:grid;grid-template-columns:auto 1fr;gap:1px 10px;margin:8px auto 0;max-width:280px;text-align:left;border-top:1px dashed var(--onp2);padding-top:7px}
.tfacts dt{font:500 9px/2 var(--fm);letter-spacing:.08em;text-transform:uppercase;color:var(--onp2)}
.tfacts dd{margin:0;font:400 13px/1.55 var(--fb);color:var(--onp)}
.tfacts .dim{font:400 10.5px var(--fm);color:var(--onp2)}
.tboard .tbsub{font:400 12px/1.6 var(--fm);color:var(--onp2);margin-top:8px;border-top:1px dashed var(--onp2);padding-top:8px}
.tboard .tbsub a{color:var(--onp)}
.tboard .btn.alt{background:transparent;color:var(--onp);border-color:var(--onp2)}
.tsec{display:flex;justify-content:space-between;align-items:flex-end;font:900 17px var(--fd);letter-spacing:.1em;text-transform:uppercase;border-bottom:1.5px solid var(--ink);margin:16px 0 4px;padding-bottom:3px}
.tsec span{font:400 10.5px var(--fm);letter-spacing:.04em;color:var(--muted);text-transform:none}
.trail{margin-bottom:6px}
.tit{cursor:pointer;display:grid;grid-template-columns:52px 1fr;gap:12px;align-items:center;width:100%;text-align:left;padding:8px 0;position:relative;color:var(--ink)}
.tit::before{content:"";position:absolute;left:25px;top:0;bottom:0;border-left:1.5px dashed var(--rule)}
.tit img,.tit svg{position:relative;z-index:1;width:50px;height:50px;border-radius:50%;object-fit:cover;background:var(--paper)}
.tit b{display:block;font:900 22px/1 var(--fd)}
.tit .t{display:block;font-size:15px}
.tit .n{display:block;font:400 11px var(--fm);color:var(--muted)}
.tit .n a{color:var(--ink)}
.tit.done{opacity:.55}
/* ===== Navy, cream and red ===== */
:root{--paper:#EFE8D8;--card:#F8F4EA;--slot:#FAF5EA;--ink:#1B2233;--ink2:#2B3348;--line:#1B2233;--rule:#C8C0AE;--muted:#6A6658;--green:#1B2A4A;--green2:#142038;--navy:#1B2A4A;--red:#B3262E;--blue:#1B2A4A;--gold-ink:#8C1D24}
header.top,.ftop{background:var(--navy);border-bottom-color:var(--ink)}
.btn{background:var(--navy)}
.btn.gold{background:var(--red);color:#fff}
.tdays button.on{background:var(--navy)}
/* the big boards are cream with a navy frame */
.tboard{background:var(--card);color:var(--navy);border:3px solid var(--navy)}
.tboard .lbl{color:var(--muted)}
.tboard .tbsub,.tboard .tbsub a{color:var(--muted)}
.tboard .tbsub{border-top-color:var(--rule)}
.tboard .btn.alt{background:var(--card);color:var(--navy);border-color:var(--navy)}
.tboard .tlogo img,.tboard .tlogo svg{box-shadow:0 0 0 2px var(--navy)}
.ttags span{border-color:var(--rule);color:var(--muted)}
.tfacts{border-top-color:var(--rule)}
.tfacts dt{color:var(--muted)}
.tfacts dd{color:var(--navy)}
.tfacts .dim{color:var(--muted)}
.sb{background:var(--card);border:3px solid var(--navy);color:var(--navy)}
.sbteam .tm{color:var(--navy)}
.sbmid{color:var(--muted)}.sbmid b{color:var(--red)}
.bar{background:var(--rule);border-color:var(--navy)}
.bar .mk{background:var(--navy)}
.sbfoot{color:var(--muted)}
.next.hero{border-top-color:var(--navy)}
.msg.mine .bub{background:var(--navy)}
.composer .send{background:var(--navy)}
.upcup{border-color:var(--navy)}
.holehero{position:relative}
.hh-mode{position:absolute;top:10px;right:10px;font:600 11px var(--fm);color:var(--navy);background:var(--slot);border:1.5px solid var(--navy);border-radius:999px;padding:4px 10px;cursor:pointer}
.hh-mode:active{background:var(--navy);color:#fff}
.holehero .meta{padding-top:30px}
/* Scorecard mode: the whole card fits on one screen */

.focus .ent .en .fstat{display:block;font:600 10.5px var(--fm);color:var(--ink2)}
.focus #scroller .wrap{padding:8px 10px 10px}
.focus .strip{margin:0 0 6px;padding:0 0 2px;gap:4px}
.focus .strip button{flex:0 0 30px;height:30px;font-size:13px}
.focus .holehero{padding:6px 12px;align-items:center}
.focus .holehero .num{font-size:46px;display:flex;align-items:baseline;gap:8px}
.focus .holehero .num small{display:inline;margin:0;font-size:12px}
.focus .holehero .meta{padding-top:0;display:flex;align-items:baseline;gap:8px;font-size:12px}
.focus .holehero .meta b{display:inline;font-size:28px}
.focus #scroller .wrap > div[style*="height:10px"]{display:none}
.focus .ent{padding:6px 8px 6px 10px;margin:6px 0 0}
.focus .ent .en b{font-size:16px}
.focus .ent .en .mline{display:none !important}
.focus .step{gap:5px}
.focus .step button{width:42px;height:42px;font-size:22px}
.focus .val{width:44px;height:44px;font-size:26px}
.focus .net{margin-top:-2px;font-size:10.5px}
.focus .holeres{min-height:0;margin:6px 0;font-size:15px}

  .focus .strip{display:none}

.aset{display:flex;gap:10px;align-items:flex-start;padding:10px 0;border-bottom:1px dashed var(--rule)}
.aset input{width:20px;height:20px;margin-top:2px;accent-color:var(--navy)}
.aset b{display:block}.aset small{display:block;color:var(--muted);font:400 12px var(--fm)}
.gpos{font:500 10.5px var(--fm);color:var(--muted)}
.gpos.on{color:var(--red);font-weight:600}
.gpos.done{color:var(--navy)}
.settle{display:grid;grid-template-columns:1fr auto;gap:4px 10px;align-items:center;padding:9px 0;border-bottom:1px dashed var(--rule)}
.settle:last-child{border-bottom:0}
.settle b{font:900 20px var(--fd)}
.settle.mine span{font-weight:700}
.settle .sact{grid-column:1 / -1}
.settle a.btn{text-decoration:none;display:inline-block}
