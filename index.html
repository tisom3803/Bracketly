/* ---------- Step 3: players, entered straight into each event ---------- */
function plLevelSel(p, extra){
  if (!isTennis()) return inp(`data-chg="pl" data-id="${p.id}" data-f="rating" inputmode="decimal" placeholder="—" aria-label="Rating" ${extra || ''}`, fmtRating(p.rating));
  return `<select data-chg="pl" data-id="${p.id}" data-f="level" aria-label="Level" ${extra || ''}><option value="">Level</option><optgroup label="Rating">${[...new Set([...TEAM_LEVELS.M, ...(p.rating != null ? [p.rating] : [])])].sort((x, y) => x - y).map(x => `<option value="${x}" ${!p.tier && p.rating === x ? 'selected' : ''}>${x.toFixed(1)}</option>`).join('')}</optgroup><optgroup label="Pro / A / B / C">${CC_TIERS.map(([k, l]) => `<option value="t:${k}" ${p.tier === k ? 'selected' : ''}>${l}</option>`).join('')}</optgroup></select>`;
}
function qaLevelOpts(ev, cur){
  if (ev.kind === 'mixed') return [['', 'Level'], ...TEAM_LEVELS.X.map(x => [String(x), 'Mixed ' + x.toFixed(1)])];
  if (ev.kind === 'clubcup') return [['', 'Level'], ...TEAM_LEVELS.M.map(x => [String(x), x.toFixed(1)]), ...CC_TIERS.map(([k, l]) => ['t:' + k, l])];
  return [['', 'Level'], ...TEAM_LEVELS.M.map(x => [String(x), x.toFixed(1)])];
}
function teamLevelSel(ev, i, t){
  if (!isTennis()) return t.filter(Boolean).map(id => P(id) ? plLevelSel(P(id)) : '').join('');
  const ids = t.filter(Boolean); let cur = '';
  if (ids.length === 2){
    if (ev.kind === 'mixed'){ const tr = teamRating(ids); cur = allRated(ids) && TEAM_LEVELS.X.includes(tr) ? String(tr) : '' }
    else { const a = P(ids[0]), b = P(ids[1]); if (a && b && a.rating != null && a.rating === b.rating) cur = String(a.rating) }
  }
  const opts = ev.kind === 'mixed' ? [['', allRated(ids) ? `Team ${fmtRating(teamRating(ids))}` : 'Level'], ...TEAM_LEVELS.X.map(x => [String(x), 'Mixed ' + x.toFixed(1)])]
    : [['', allRated(ids) ? `${ids.map(id => fmtRating((P(id) || {}).rating)).join(' + ')}` : 'Level'], ...TEAM_LEVELS.M.map(x => [String(x), x.toFixed(1)])];
  return sel(`data-chg="teamlv" data-ev="${ev.id}" data-i="${i}" aria-label="Team level"`, opts, cur);
}
function quickAdd(ev){

  let fields = '';
  if (ev.kind === 'singles') fields = nm(1, 'Name');
  else if (ev.kind === 'clubcup') fields = nm(1, 'Name');
  else if (ev.kind === 'proam') fields = ['Pro', 'A player', 'B player', 'C player'].map((l, i) => nm(i + 1, l)).join('');
  else fields = nm(1, ev.kind === 'mixed' ? "Man's name" : 'Player 1') + nm(2, ev.kind === 'mixed' ? "Woman's name" : 'Player 2');

  const club = ev.kind === 'clubcup' ? sel(`id="qa-club" data-chg="qaclub" aria-label="Club"`, [['A', ev.clubCup.teamAName], ['B', ev.clubCup.teamBName]], view.qaClub || 'A') : '';

}
function entryList(ev){

function wzPlayers(){

  const noLv = players().filter(p => allIn.has(p.id) && p.rating == null && !p.tier).filter(p => !evs.some(e => e.teamLv && (e.pairs || []).some(t => t.includes(p.id) && e.teamLv[pairKey(t)] != null)) && evs.some(e => (e.level || e.cap) && [...(e.entrants || []), ...(e.pairs || []).flat()].includes(p.id))).length;
  const noMF = players().filter(p => allIn.has(p.id) && !p.gender && evs.some(e => (e.gender === 'M' || e.gender === 'F' || e.kind === 'mixed') && [...(e.entrants || []), ...(e.pairs || []).flat()].includes(p.id))).length;

  ${importPreview()}
  ${view.divImp ? divImportCard(true) : ''}
  ${(() => { const inEv = new Set(evs.flatMap(e => [...(e.entrants || []), ...(e.pairs || []).flat(), ...((e.clubCup || {}).aIds || []), ...((e.clubCup || {}).bIds || [])]).filter(Boolean)), loose = players().filter(p => !inEv.has(p.id));

  ${evTabs(evs, ev, e => entryNoun(e, entryCount(e)))}
  <div class="evhead"><b>${esc(ev.name)}</b><span class="small muted">${esc(KINDS[ev.kind].label)}${ev.level ? ' · ' + fmtLevel(ev.level) + ' and under' : ''}${ev.cap ? ' · combined ' + fmtLevel(ev.cap) : ''} · ${entryNoun(ev, n)}</span></div>

    <div class="grid2"><div><label class="small muted">Points per match</label>${inp(`data-chg="ccv" data-id="${ev.id}" data-f="pointsPerMatch" inputmode="decimal"`, cc.pointsPerMatch)}</div><div><label class="small muted">Points to win (0 = most points)</label>${inp(`data-chg="ccv" data-id="${ev.id}" data-f="pointsToWin" inputmode="decimal"`, cc.pointsToWin)}</div></div>

  <h3>Add ${ev.kind === 'singles' || ev.kind === 'clubcup' ? 'players' : ev.kind === 'proam' ? 'teams of four' : 'teams'}</h3>

    <textarea id="paste" rows="4" placeholder="${ev.kind === 'singles' || ev.kind === 'clubcup' ? 'Jane Doe, 3.5&#10;Mike Chen, 4.0' : 'Amy Fox 3.5 / Ben Carter 3.5&#10;Cara Nash 4.0 / Dan Park 4.0'}">${esc(view.paste || '')}</textarea>
    <div class="row" style="justify-content:space-between;margin-top:6px"><span class="small muted">One ${ev.kind === 'singles' || ev.kind === 'clubcup' ? 'player' : 'team'} per line${ev.kind === 'singles' || ev.kind === 'clubcup' ? '' : ', partners split with a slash'}.</span><button class="btn sm" data-act="pasteev" data-ev="${ev.id}">Add to ${esc(ev.name)}</button></div>

  ${others.length ? `<details class="more"><summary>Add players already entered in other events (${others.length})</summary><div class="pchips">${others.map(p => `<label class="pchip"><input type="checkbox" data-chg="${ev.kind === 'clubcup' ? 'ccadd' : 'entrant'}" data-ev="${ev.id}" data-id="${p.id}"><b>${esc(p.name)}</b><span>${esc([p.tier ? tierLabel(p.tier) : fmtRating(p.rating), p.gender].filter(Boolean).join(' '))}</span></label>`).join('')}</div></details>` : ''}
  <details class="more" ${view.rosterOpen ? 'open' : ''}><summary data-act="rostertoggle">Everyone on the roster (${players().length}) · signups · upload a full list</summary>${wzRosterAll(true)}</details>`;

/* ---------- Step 4: bracket builder ---------- */
function recommendFormat(ev, n){
  if (ev.kind === 'proam') return 'pro_am';

/* ---------- Step 2: courts & times ---------- */
function wzCourts(){
  const c = cfg(), courts = c.courts || [], days = (c.days || []).slice().sort((a,b) => a.date.localeCompare(b.date));
  const cap = capacity(), need = events().reduce((s, e) => s + estMatches(normEvent(e)), 0);
  const rules = Object.assign(defaultScheduleRules(), c.rules || {});
  const tog = (k, t, sub) => `<label class="aset"><input type="checkbox" data-chg="rule" data-p="${k}" ${rules[k] ? 'checked' : ''}><span><b>${t}</b><small>${sub}</small></span></label>`;
  return `<h2 style="margin-top:4px">Courts & times</h2>
  <div class="fits ${need > cap || !cap ? 'bad' : ''}"><b>Fits about ${cap} matches</b><span>${TIME_SLOTS.length} time slot${TIME_SLOTS.length === 1 ? '' : 's'} × ${courts.length} court${courts.length === 1 ? '' : 's'}${need ? ` · your events need about ${need}` : ''}</span>
    ${days.length > 1 ? `<span class="perday">${days.map(d => { const n = d.on === false ? 0 : daySlotCount(d); return `<i class="${d.on !== false && !n ? 'bad' : ''}">${esc(dayLabel(d.date).split(',')[0])} ${d.on === false ? 'off' : n + ' × ' + courts.length}</i>` }).join('')}</span>` : ''}</div>
  <h3>Courts</h3>
  <div class="card adm"><div class="row" style="align-items:center"><span class="small muted">How many</span><div class="step"><button data-act="courtn" data-v="-1" aria-label="One fewer court">−</button><b style="min-width:32px;text-align:center;display:inline-block">${courts.length}</b><button data-act="courtn" data-v="1" aria-label="One more court">+</button></div></div>
    <div class="cnames">${courts.map((x, i) => inp(`data-chg="courtname" data-i="${i}" aria-label="Court ${i + 1} name"`, x.name)).join('')}</div>
    <p class="wnote" style="margin-bottom:0">Rename courts to match the signs at your club, like "Stadium" or "Court 7".</p></div>
  <h3>Hours</h3>
  <div class="card adm">${days.length ? `<table class="tbl hours"><tr><th style="text-align:left">Day</th><th>Play</th><th>First match</th><th>Last match starts</th></tr>${days.map(d => `<tr><td style="text-align:left"><b>${esc(dayLabel(d.date))}</b></td><td><input type="checkbox" data-chg="dayon" data-d="${d.date}" ${d.on !== false ? 'checked' : ''} aria-label="Play on ${esc(dayLabel(d.date))}"></td><td><input type="time" data-chg="dayt" data-d="${d.date}" data-f="start" value="${esc(d.start)}"></td><td><input type="time" data-chg="dayt" data-d="${d.date}" data-f="end" value="${esc(d.end)}"></td></tr>${d.on !== false && !daySlotCount(d) ? `<tr><td colspan="4" style="text-align:left"><span class="warn" style="margin:0">No match times on ${esc(dayLabel(d.date))}: the last match starts before the first. Check AM/PM.</span></td></tr>` : d.on !== false ? `<tr class="dayn"><td colspan="4" style="text-align:left">${daySlotCount(d)} match time${daySlotCount(d) === 1 ? '' : 's'}: ${esc(fmt12h(toMin(d.start)))} to ${esc(fmt12h(toMin(d.start) + (daySlotCount(d) - 1) * (c.slotMinutes || 90)))}</td></tr>` : ''}`).join('')}</table>` : '<p class="small muted">Pick the dates on the Basics step first.</p>'}
    <label class="small muted" style="margin-top:10px;display:block">Match length (time slot)</label>
    <div class="seg">${[45, 60, 75, 90, 105, 120].map(n => `<button class="${(c.slotMinutes || 90) === n ? 'on' : ''}" data-act="cfgset" data-p="slotMinutes" data-v="${n}" data-num="1">${n < 60 ? n + 'm' : Math.floor(n / 60) + 'h' + (n % 60 ? ' ' + n % 60 : '')}</button>`).join('')}</div></div>
  <h3>Scheduling rules</h3>
  <div class="card adm">${tog('finalsOnLastDay', 'Finals on the last day', 'Championship matches wait for the final day')}${tog('semifinalsNotFirstDay', 'No semifinals on day one', 'Keeps the opening day for early rounds')}${tog('roundRobinSpread', 'Spread round robins across days', 'Instead of playing them all at once')}${tog('firstRoundsAlign', 'Start every event together', 'First rounds share the opening slots')}${tog('spreadAcrossDays', 'Keep every day busy', 'Later rounds lean toward later days')}
    <label class="small muted" style="margin-top:8px;display:block">Finals on these courts only</label>
    <div class="checks inline">${courts.map((x, i) => `<label><input type="checkbox" data-chg="finalcourt" data-i="${i + 1}" ${(rules.finalsCourts || []).includes(i + 1) ? 'checked' : ''}> ${esc(x.name)}</label>`).join('')}</div>

function importPreview(){
  const im = view.imp; if (!im) return '';
  const plan = planImport(im.entries), sample = im.entries.slice(0, 6);
  plan.rated = Math.min(plan.people, im.entries.reduce((n, e) => n + (e.b && e.teamRating != null ? 2 : [e.a, e.b].filter(x => x && (x.rating != null || x.tier)).length), 0));
  const show = x => x && x.tier && x.rating == null ? `${esc(x.name)} ${tierLabel(x.tier)}${x.gender ? ' ' + x.gender : ''}` : x ? `${esc(x.name)}${x.rating != null ? ' ' + fmtRating(x.rating) : ''}${x.gender ? ' ' + x.gender : ''}` : '';
  const cols = im.header && im.map ? Object.entries(im.map).map(([k, i]) => `${({name:'Name', first:'First', last:'Last', rating:'Rating', gender:'M/F', email:'Email', phone:'Phone', club:'Club', event:'Event', p2name:'Partner', p2first:'Partner first', p2last:'Partner last', p2rating:'Partner rating', p2gender:'Partner M/F', p2email:'Partner email', p2phone:'Partner phone'})[k] || k} ← "${esc(im.header[i])}"`).join(' · ') : 'No header row found, so each row was read as name, rating, M/F.';
  return `<div class="card adm impbox"><h3 style="margin-top:0">Found in ${esc(im.file)}</h3>
    <p style="margin:0 0 6px"><b>${plan.people} player${plan.people === 1 ? '' : 's'}</b>${plan.teams ? `, in <b>${plan.teams} team${plan.teams === 1 ? '' : 's'}</b>` : ''}${plan.existing.length ? `, entering ${plan.existing.map(esc).join(', ')}` : ''}${plan.newEvents.length ? `. New events: <b>${plan.newEvents.map(esc).join(', ')}</b>` : ''}.</p>
    ${im.header ? `<details class="colmap" ${im.showCols || !plan.rated ? 'open' : ''}><summary>${plan.rated ? `Levels read for ${plan.rated} of ${plan.people}.` : '<b style="color:var(--red)">No ratings or levels found.</b>'} Columns${plan.rated ? '' : ': pick which one holds the level'}</summary>
      <div class="cmgrid">${im.header.map((h, i) => { const role = Object.keys(im.map).find(k => im.map[k] === i) || ''; const ex = (im.table[(im.hi ?? -1) + 1] || [])[i]; return `<label><span><b>${esc(h || 'Column ' + (i + 1))}</b>${ex ? `<i>${esc(String(ex).slice(0, 24))}</i>` : ''}</span>${sel(`data-chg="impcol" data-i="${i}"`, COL_ROLES, role)}</label>` }).join('')}</div></details>` : `<p class="small muted" style="margin:0 0 8px">${cols}</p>`}
    <ol class="impl">${sample.map(e => `<li>${show(e.a)}${e.b ? ' / ' + show(e.b) : ''}${(e.events || []).length ? ` <span class="small muted">· ${e.events.map(esc).join(', ')}</span>` : ''}</li>`).join('')}${im.entries.length > sample.length ? `<li class="small muted">…and ${im.entries.length - sample.length} more</li>` : ''}</ol>
    ${!plan.existing.length && !plan.newEvents.length && events().length ? `<label class="small muted">Also enter everyone in</label>${sel('id="imp-ev"', [['', 'No event, just the roster'], ...events().filter(e => e.kind !== 'clubcup').map(e => [e.id, e.name])], view.impTarget || '')}` : ''}
    <div class="row" style="margin-top:10px"><button class="btn gold" data-act="impgo">Add ${plan.people} player${plan.people === 1 ? '' : 's'}</button><button class="btn alt" data-act="impcancel">Cancel</button></div></div>`;
}

function teamForm(){
  const tm = view.tm || {}, type = tm.type || 'M', tennis = (cfg() || {}).sport !== 'pickleball';

  const ev = tennis ? matchingEvent(type, lv) : null;
  const evOpts = [['', 'No event yet'], ...events().filter(e => KINDS[e.kind].size === 2 && (type === 'X' ? e.kind === 'mixed' : e.kind !== 'mixed')).map(e => [e.id, e.name])];
  if (tennis && !ev) evOpts.splice(1, 0, ['new', `New event: ${teamTypeName(type)} ${lv.toFixed(1)}`]);
  const evVal = tm.evTouched ? (tm.ev || '') : (ev ? ev.id : (tennis ? 'new' : ''));
  const lab = n => type === 'X' ? (n === 1 ? 'Man' : 'Woman') : 'Player ' + n;
  return `<div class="card adm teamform">
    <div class="seg">${[['M', "Men's"], ['F', "Women's"], ['X', 'Mixed']].map(([k, l]) => `<button class="${type === k ? 'on' : ''}" data-act="tmtype" data-v="${k}">${l}</button>`).join('')}</div>
    <div class="tfrow2"><input id="tm1-name" placeholder="${lab(1)}'s name" autocomplete="off" value="${esc(tm.n1 || '')}"><input id="tm2-name" placeholder="${lab(2)}'s name" autocomplete="off" value="${esc(tm.n2 || '')}"></div>
    ${tennis ? `<label class="small muted">${type === 'X' ? 'Combined level' : 'Level'}</label><div class="seg lvls">${lvls.map(x => `<button class="${x === lv ? 'on' : ''}" data-act="tmlv" data-v="${x}">${levelLabel(type, x)}</button>`).join('')}</div>`
      : `<div class="tfrow2"><input id="tm1-rating" inputmode="decimal" placeholder="${esc(sport().rating)} for player 1" value="${esc(tm.r1 || '')}"><input id="tm2-rating" inputmode="decimal" placeholder="${esc(sport().rating)} for player 2" value="${esc(tm.r2 || '')}"></div>`}

    <p class="wnote" style="margin-bottom:0">${type === 'X' ? 'Mixed teams are one man and one woman; the level is their combined rating, so a Mixed 7.0 team fits a 7.0 event.' : `Both players are rated at the level you pick, so a ${teamTypeName(type)} 3.5 team fits a 3.5 event.`} Partners stay linked for auto-pairing.</p></div>`;

    ${(() => { const n = teamsOf(ev).length; return ev.format === 'round_robin' && n > 10 ? `<p class="warn">${n} ${ev.kind === 'singles' ? 'players' : 'teams'} in one round robin is ${n * (n - 1) / 2} matches. Pools into a playoff is shorter. <button class="small" style="text-decoration:underline" data-act="evfmt" data-id="${ev.id}" data-v="multi_pool">Switch to pools</button></p>` : '' })()}

}

/* ---------- Step 5: entries ---------- */

  const ev = evs.find(e => e.id === view.ev) || evs[0], locked = isDrawn(ev) && hasResults(ev);
  const tabs = `<div class="rtabs">${evs.map(e => `<button class="rtab ${e.id === ev.id ? 'on' : ''}" data-act="ev" data-v="${e.id}"><b>${esc(e.name)}</b><span>${e.kind === 'clubcup' ? ((e.clubCup || {}).aIds || []).length + ((e.clubCup || {}).bIds || []).length + ' players' : teamsOf(e).length + (e.kind === 'singles' ? ' players' : ' teams')}</span></button>`).join('')}</div>`;

  <div class="pairs">${ev.pairs.map((t, i) => { const iss = pairIssue(ev, t); return `<div class="pair ${iss ? 'bad' : ''}">${Array.from({length:size}, (_, j) => `${ev.kind === 'proam' ? `<i class="role">${['Pro','A','B','C'][j]}</i>` : ''}${sel(`data-chg="pairpick" data-ev="${ev.id}" data-i="${i}" data-j="${j}" ${locked ? 'disabled' : ''}`, [['', '—'], ...ev.entrants.filter(P).map(id => [id, `${pname(id)}${(P(id) || {}).rating != null ? ' ' + fmtRating(P(id).rating) : ''}`])], t[j] || '')}`).join('')}<span class="pr">${t.filter(Boolean).length === size && allRated(t.filter(Boolean)) ? fmtRating(teamRating(t)) : ''}</span><button class="x" data-act="rmpair" data-ev="${ev.id}" data-i="${i}" ${locked ? 'disabled' : ''} aria-label="Remove team">×</button>${iss ? `<span class="warn" style="width:100%;margin:2px 0 0">${esc(iss)}</span>` : ''}</div>` }).join('')}</div>

  <p class="wnote">${ev.seeding === 'rating' ? `Seeds follow ${size > 1 ? 'combined team' : ''} rating, highest first. Unrated ${size > 1 ? 'teams' : 'players'} go last.` : 'Use the arrows to set the order. New entries start at the bottom.'}</p>

function clubCupEntries(ev){

/* ---------- Step 6: draws & schedule ---------- */
function wzDraws(){
  syncEngine();
  const evs = state.events, cap = TIME_SLOTS.length * state.tournamentCourts, total = evs.reduce((s, e) => s + (e.matches.length || estMatches(e)), 0);
  const uns = evs.flatMap(e => e.matches).filter(m => typeof m.slotIdx !== 'number'), conf = clashList();
  const cur = evs.find(e => e.id === view.ev) || null;
  return `<h2 style="margin-top:4px">Draws & schedule</h2>
  <div class="fits ${total > cap ? 'bad' : ''}"><b>${total} matches · room for about ${cap}</b><span>${total > cap ? 'Add a court, a day, or longer hours on step 2, or shorten match length.' : 'Fits in your courts and hours.'}</span></div>
  ${evs.some(e => e.matches.some(m => m._lost)) ? `<div class="missing"><div class="mh2"><b>The hours changed after the schedule was built</b></div><p class="small" style="margin:4px 0 8px">Some matches were set for times that no longer exist. Rebuilding keeps finished matches where they are.</p><button class="btn sm" data-act="resched">Rebuild schedule</button></div>` : ''}

    <div class="row">${ev.kind === 'clubcup' ? `<button class="btn alt sm" data-act="ev" data-v="${ev.id}">Lineup</button>` : `<button class="btn alt sm" data-act="drawone" data-id="${ev.id}" ${hasResults(ev) ? 'disabled' : ''}>${isDrawn(ev) ? 'Redraw' : 'Draw'}</button>`}${isDrawn(ev) ? `<button class="btn alt sm" data-act="ev" data-v="${ev.id}">Preview</button><button class="btn ${ev.published ? 'alt' : ''} sm" data-act="publish" data-id="${ev.id}">${ev.published ? 'Unpublish' : 'Publish'}</button>` : ''}</div></div>`).join('')}
  ${evs.some(isDrawn) && evs.some(e => isDrawn(e) && !e.published) ? `<button class="btn" data-act="publishall">Publish all draws</button>` : ''}
  ${cur ? `<h3>${esc(cur.name)}</h3>${cur.kind === 'clubcup' ? lineupEditor(cur) : roundTimes(cur)}${cur.matches.length ? eventDraw(cur) : ''}` : ''}
  ${uns.length ? `<p class="warn">${uns.length} match${uns.length === 1 ? '' : 'es'} didn't fit. Add courts or hours, then rebuild the schedule.</p>` : ''}
  ${conf.length ? `<div class="missing"><div class="mh2"><b>Time clashes</b></div>${conf.slice(0, 12).map(clashItem).join('')}${conf.length > 12 ? `<p class="small muted" style="margin:4px 0 0">and ${conf.length - 12} more</p>` : ''}<p class="small muted" style="margin:6px 0 0">Tap a match in the grid below to move it, or add time on step 2.</p></div>` : ''}
  ${schedGrid()}`;
}
function lineupEditor(ev){

function schedGrid(){

  ${TIME_SLOTS.map((s, i) => s[0] !== dk ? '' : `<div class="sgr"><span>${esc(s[1])}</span>${Array.from({length:n}, (_, c) => { const m = (by[i] || {})[c + 1]; return m ? `<button class="sgm${view.hlMatch === m.id ? ' hl' : ''}" ${view.hlMatch === m.id ? 'aria-current="true"' : ''} data-act="movemenu" data-id="${esc(m.id)}"><b>${m.pin ? '📌 ' : ''}${esc((findEvent(m.eventId) || {}).name)}</b>${esc(sideLabel(m,'team1',true))}<br>${esc(sideLabel(m,'team2',true))}</button>` : '<i></i>' }).join('')}</div>`).join('')}</div>`;

/* Time and court controls shared by the lineup editor and the round list */
function slotOptions(cur, auto){ return `${auto ? `<option value="" ${cur == null ? 'selected' : ''}>${auto}</option>` : ''}${[...new Set(TIME_SLOTS.map(s => s[0]))].map(d => `<optgroup label="${esc(d)}">${TIME_SLOTS.map((s, i) => s[0] === d ? `<option value="${i}" ${i === cur ? 'selected' : ''}>${esc(d.split(',')[0])} ${esc(s[1])}</option>` : '').join('')}</optgroup>`).join('')}` }
function courtOptions(cur){ return ((cfg() || {}).courts || []).map((c, i) => `<option value="${i + 1}" ${i + 1 === cur ? 'selected' : ''}>${esc(c.name)}</option>`).join('') }
function groupStart(ms, label){

/* ---------- Style (from Roundly) ---------- */
function contrastWarn(p){
  const L = h => { const c = hex2rgb(h).map(x => { x /= 255; return x <= .03928 ? x/12.92 : Math.pow((x+.055)/1.055, 2.4) }); return .2126*c[0] + .7152*c[1] + .0722*c[2] };
  const ratio = (a, b) => { const x = L(a), y = L(b); return (Math.max(x,y) + .05) / (Math.min(x,y) + .05) };
  const out = [];
  if (ratio(p.ink, p.paper) < 4.5 || ratio(p.ink, p.card) < 4.5) out.push('Text is hard to read on that background.');
  if (ratio(p.primary, p.paper) < 3) out.push('The main color is close to the background, so the header and buttons will blend in.');
  return out.map(x => `<p class="warn">${x}</p>`).join('');
}

  const all = allMatches(false);
  const occ = all.find(o => o.id !== m.id && o.slotIdx === slot && o.court === court);
  const mine = getKnownMatchPlayers(m);
  const clash = all.filter(o => o.id !== m.id && o !== occ && o.slotIdx === slot && getKnownMatchPlayers(o).some(p => mine.includes(p)));
  const occClash = occ && typeof m.slotIdx === 'number' ? all.filter(o => o.id !== occ.id && o.id !== m.id && o.slotIdx === m.slotIdx && getKnownMatchPlayers(o).some(p => getKnownMatchPlayers(occ).includes(p))) : [];

  const warns = [];
  if (occ) warns.push(`${courtName(court)} already has ${sideLabel(occ, 'team1', true)} vs ${sideLabel(occ, 'team2', true)} then. They swap into this match's current place${typeof m.slotIdx === 'number' ? ` (${slotTxt(m.slotIdx)}, ${courtName(m.court)})` : ''}.`);

  occClash.forEach(o => warns.push(`After the swap, ${getKnownMatchPlayers(o).filter(p => getKnownMatchPlayers(occ).includes(p)).join(', ')} would be double-booked at ${slotTxt(m.slotIdx)}.`));

/* Remember where a match was first placed before a director move, so the schedule can say "Time changed". */

// A shareable 1080×1350 card image in the tournament's colors
async function drawPlayerCard(pid){
  const p = P(pid) || {}, c = cardOf(pid), pal = palette(), W = 1080, H = 1350, cv = document.createElement('canvas'); cv.width = W; cv.height = H; const g = cv.getContext('2d');
  const st = styleOf(), fs = FONTSETS[st.fonts] || FONTSETS.bracketly, fd = fs.fd.split(',')[0].replace(/'/g, ''), fb = 'Inter';
  try{ await document.fonts.load(`700 80px "${fd}"`); await document.fonts.load('600 40px Inter') }catch(e){}
  const grad = g.createLinearGradient(0, 0, 0, H); grad.addColorStop(0, pal.primary); grad.addColorStop(1, mix(pal.primary, '#000000', .45)); g.fillStyle = grad; g.fillRect(0, 0, W, H);
  g.strokeStyle = pal.gold; g.lineWidth = 8; g.strokeRect(40, 40, W - 80, H - 80);
  const ld = im => new Promise((res, rej) => { const i = new Image(); i.crossOrigin = 'anonymous'; i.onload = () => res(i); i.onerror = rej; i.src = im });
  const cx = W / 2, cy = 400, R = 200;
  g.save(); g.beginPath(); g.arc(cx, cy, R, 0, Math.PI * 2); g.closePath(); g.fillStyle = pal.card; g.fill(); g.clip();
  let drew = false; if (c.photo){ try{ const im = await ld(c.photo), s = Math.max(2 * R / im.width, 2 * R / im.height); g.drawImage(im, cx - im.width * s / 2, cy - im.height * s / 2, im.width * s, im.height * s); drew = true }catch(e){} }
  if (!drew){ g.fillStyle = pal.primary; g.font = `700 160px "${fd}", Georgia, serif`; g.textAlign = 'center'; g.textBaseline = 'middle'; g.fillText(initials(p.name), cx, cy + 8) }
  g.restore(); g.lineWidth = 10; g.strokeStyle = pal.gold; g.beginPath(); g.arc(cx, cy, R + 8, 0, Math.PI * 2); g.stroke();
  g.textAlign = 'center'; g.textBaseline = 'alphabetic';
  let size = 84; g.font = `700 ${size}px "${fd}", Georgia, serif`; while (g.measureText(p.name || '').width > W - 200 && size > 44){ size -= 4; g.font = `700 ${size}px "${fd}", Georgia, serif` }
  g.fillStyle = pal.paper; g.fillText(p.name || 'Player', cx, 720);
  const rating = brand().cards.rating !== false && p.rating != null && p.rating !== '' ? `${sport().rating} ${fmtRating(p.rating)}` : '';
  g.fillStyle = pal.gold; g.font = `600 44px ${fb}, sans-serif`; if (rating) g.fillText(rating, cx, 790);
  g.fillStyle = mix(pal.paper, pal.primary, .2); { const meta = cardMeta(p), y0 = rating ? 850 : 800; let fsz = 36; const one = meta.join(' · '); g.font = `500 ${fsz}px ${fb}, sans-serif`; while (g.measureText(one).width > W - 200 && fsz > 28){ fsz -= 2; g.font = `500 ${fsz}px ${fb}, sans-serif` }
    if (g.measureText(one).width <= W - 200) g.fillText(one, cx, y0); else { const a = meta.slice(0, 1).join(''), b2 = meta.slice(1).join(' · '); g.fillText(a.slice(0, 50), cx, y0); g.fillText(b2.slice(0, 60), cx, y0 + 44) } }
  if (c.bio){ g.font = `400 34px ${fb}, sans-serif`; const words = c.bio.split(/\s+/), lines = []; let ln = ''; words.forEach(w => { const t = ln ? ln + ' ' + w : w; if (g.measureText(t).width > W - 240){ lines.push(ln); ln = w } else ln = t }); if (ln) lines.push(ln); lines.slice(0, 4).forEach((l, i) => g.fillText(l + (i === 3 && lines.length > 4 ? '…' : ''), cx, 960 + i * 48)) }
  g.fillStyle = pal.gold; g.fillRect(cx - 60, 1150, 120, 3);
  g.fillStyle = pal.paper; g.font = `700 40px "${fd}", Georgia, serif`; g.fillText(tripTitle().slice(0, 40), cx, 1215);
  g.fillStyle = mix(pal.paper, pal.primary, .35); g.font = `500 28px ${fb}, sans-serif`; g.fillText([datesShort(), (cfg() || {}).club].filter(Boolean).join(' · ') + ' · Bracketly', cx, 1262);
  return await new Promise(res => cv.toBlob(res, 'image/png'));
}

/* ---------- club standings from real results (only when the director turns it on) ---------- */
function clubStandings(){
  const byName = new Map(players().map(p => [normName(p.name), p])), clubOf = p => (cardOf(p.id).club || p.club || '').trim();
  const clubs = new Map(); players().forEach(p => { const c = clubOf(p); if (c && !clubs.has(c)) clubs.set(c, 0) });
  let counted = 0;
  state.events.filter(e => e.published || view.admin).forEach(e => e.matches.forEach(m => { const w = winnerSlot(m); if (!w || !resOf(m.id)) return; const ns = sideNames(m, w) || [], cs = [...new Set(ns.map(n => byName.get(normName(n))).filter(Boolean).map(clubOf))]; if (cs.length === 1 && cs[0]){ clubs.set(cs[0], (clubs.get(cs[0]) || 0) + 1); counted++ } }));
  return {list:[...clubs.entries()].map(([name, pts]) => ({name, pts})).sort((a, b) => b.pts - a.pts || a.name.localeCompare(b.name)), counted};
}
function clubBoardHtml(){

    <span class="v3-board-mid">${ICON.trophy}<em>Club points</em><small>${more > 0 ? `+${more} more club${more === 1 ? '' : 's'}` : '1 per match won'}</small></span>

}

/* Which field the user is in, so a redraw can put them back with what they've typed.
   Fields without an id are matched by their data-* attributes. */
const FKEYS = ['chg','p','id','f','i','d','ev','j','s','k'];
function fieldKey(el){ if (!el || !/^(INPUT|TEXTAREA|SELECT)$/.test(el.tagName)) return null; if (el.id) return '#' + el.id; if (!el.dataset.chg) return null; return Object.keys(el.dataset).sort().map(k => k + '=' + el.dataset[k]).join('&') }
function findField(key){ if (!key) return null; if (key[0] === '#') return document.getElementById(key.slice(1)); return [...document.querySelectorAll('[data-chg]')].find(el => fieldKey(el) === key) || null }
const isTyping = () => { const a = document.activeElement; return !!a && (a.tagName === 'TEXTAREA' || (a.tagName === 'INPUT' && !/^(checkbox|radio|file|button|submit|color|date|time)$/.test(a.type))) };
function drawInner(){
  try{ applyTheme() }catch(e){ console.warn('theme', e) }
  const a = document.activeElement, fkey = fieldKey(a), typed = a && fkey && isTyping() ? a.value : null;
  let fid = fkey, sel = a && typeof a.selectionStart === 'number' ? [a.selectionStart, a.selectionEnd] : null;
  _typed = typed;
  if (view.qaFocus){ _typed = null; fid = '#' + view.qaFocus; sel = null; view.qaFocus = null }
  const old = document.getElementById('scroller'), keep = old && !view.resetScroll ? old.scrollTop : 0;
  view.resetScroll = false;
  app.classList.toggle('tvmode', !!(TRIP && view.tv));
  app.classList.toggle('v3home', view.tab === 'today' && view.screen !== 'wizard');
  if (!TRIP && view.screen === 'wizard'){ app.innerHTML = wizardView(); restoreFocus(fid, sel); return }
  if (view.screen === 'land' || !TRIP){ app.innerHTML = landingView(); restoreFocus(fid, sel); return }
  if (!cfg()){
    app.innerHTML = `<div class="land"><div class="land-in" style="text-align:center;padding-top:60px">${crestSvg(76)}<h2>${Store.lastErr ? "Can't reach the tournament" : 'Loading the tournament…'}</h2>${Store.lastErr ? `<p class="small muted">${esc(Store.lastErr)}</p>` : ''}<button class="btn alt sm" data-act="leavetrip">All tournaments</button></div></div>`;
    return;
  }
  syncEngine();
  if (view.print){ app.innerHTML = `<div id="scroller">${printView()}</div>`; return }
  if (view.tv){ app.innerHTML = `<div id="scroller">${tvView()}</div>`; return }
  if (view.signup){ app.innerHTML = `<div id="scroller">${signupView()}</div>` + modal(); restoreFocus(fid, sel); return }
  if (view.screen === 'wizard'){ app.innerHTML = wizardView() + modal(); finishDraw(keep, fid, sel); return }
  if (!view.me && view.tab !== 'admin'){ app.innerHTML = gate() + modal(); restoreFocus(fid, sel); return }
  let main;
  try{ main = body() }catch(err){ console.error(err); main = `<div class="card" style="margin-top:14px"><b>Something on this page hit a snag.</b><p class="small">${esc(err && err.message || err)}</p><div class="row"><button class="btn sm" onclick="location.reload()">Reload</button></div></div>` }
  app.innerHTML = header() + bannersHtml() + `<div id="scroller"><main class="wrap" id="main">${ctxRow(view.tab === 'admin')}${main}</main></div>` + (view.tab === 'chat' && view.me && (view.ctab || 'chat') === 'chat' ? composer() : '') + (view.tab === 'admin' ? '' : tabbar()) + modal() + ((needIntro() || (view.introForce && welcome().video)) && !view.modal ? introModal() : '');
  finishDraw(keep, fid, sel);
}
let _typed = null;
function restoreFocus(fid, sel){
  if (!fid) return;
  const n = findField(fid); if (!n) return;
  if (_typed != null && n.value !== _typed) n.value = _typed;
  n.focus({preventScroll:true});
  if (sel) try{ n.setSelectionRange(sel[0], sel[1]) }catch(e){}
}
function finishDraw(keep, fid, sel){
  const sc = document.getElementById('scroller'); if (sc) sc.scrollTop = keep;
  restoreFocus(fid, sel);
  if (view.tab === 'chat' && sc){ const n = Store.keys('chat:').length; if (n !== view.chatCount || view.stick){ view.chatCount = n; view.stick = false; sc.scrollTop = sc.scrollHeight } LS.set(TK('chatseen'), Date.now()) }
}

/* ---------- Old Bracketly import ----------
   Keeps every match, feeder link, schedule slot and result exactly as they were, adds the
   roster, and maps the weekday-only schedule onto real dates. */
const OLD_DAYS = ['Friday','Saturday','Sunday','Monday','Tuesday','Wednesday','Thursday'];
function nextWeekday(name){ const want = ['Sunday','Monday','Tuesday','Wednesday','Thursday','Friday','Saturday'].indexOf(name), d = new Date(); for (let i = 0; i < 8; i++){ if (d.getDay() === want) return isoDay(d); d.setDate(d.getDate() + 1) } return isoDay(new Date()) }
function importBracketly(st, start, name){
  const sc = st.scheduleConfig || {days:[], slotMinutes:90}, wk = ['Sunday','Monday','Tuesday','Wednesday','Thursday','Friday','Saturday'];
  const enabled = (sc.days || []).filter(d => d.enabled).sort((a, b) => OLD_DAYS.indexOf(a.day) - OLD_DAYS.indexOf(b.day));
  const [y, mo, dd] = start.split('-').map(Number); let cur = new Date(y, mo - 1, dd);
  const days = enabled.map((d, i) => { if (i > 0){ cur = new Date(cur); cur.setDate(cur.getDate() + 1); while (wk[cur.getDay()] !== d.day) cur.setDate(cur.getDate() + 1) } else { while (wk[cur.getDay()] !== d.day) cur.setDate(cur.getDate() + 1) } return {date:isoDay(cur), on:true, start:d.startTime, end:d.endTime} });
  const pl = [], nameToId = n => { if (!n || ['(needs partner)','tbd','bye'].includes(String(n).toLowerCase())) return null; let p = findByName(n, pl); if (!p){ p = {id:'p' + uid(), name:String(n).trim(), rating:null, gender:'', email:'', phone:'', club:''}; pl.push(p) } return p.id };
  const evs = (st.events || []).map(e => {
    const ev = JSON.parse(JSON.stringify(e));
    ev.teams = ev.teams || []; ev.matches = ev.matches || [];
    ev.kind = ev.format === 'pro_am' ? 'proam' : ev.format === 'club_cup' ? 'clubcup' : ev.teams.some(t => (t.players || []).length === 1) && !ev.teams.some(t => (t.players || []).length > 1) ? 'singles' : /mx|mixed/i.test(ev.name || '') ? 'mixed' : 'doubles';
    ev.gender = ev.kind === 'mixed' ? 'X' : /^(m|men)/i.test(ev.name || '') && !/mx/i.test(ev.name) ? 'M' : /^(w|women)/i.test(ev.name || '') ? 'F' : '';
    const lv = (ev.name || '').match(/(\d\.\d)/); if (lv){ if (ev.kind === 'mixed') ev.cap = parseFloat(lv[1]); else ev.level = parseFloat(lv[1]) }
    ev.teams.forEach(t => { t.pids = (t.players || []).map(nameToId) });
    ev.entrants = [...new Set(ev.teams.flatMap(t => t.pids).filter(Boolean))];
    ev.pairs = ev.kind === 'singles' ? [] : ev.teams.map(t => t.pids.map(x => x || ''));
    ev.pairing = 'hand'; ev.seeding = 'hand'; ev.order = ev.teams.map(t => t.id);
    ev.scoring = Object.assign({main:(st.scoringDefaults || {}).main || 'tennis_bo3_mtb10', consolation:(st.scoringDefaults || {}).consolation || 'tennis_pro8'}, ev.scoringOverride || {}); ev.scoringOverride = ev.scoring;
    if (ev.clubCup){ ev.clubCup.aIds = (ev.clubCup.teamARoster || []).map(nameToId).filter(Boolean); ev.clubCup.bIds = (ev.clubCup.teamBRoster || []).map(nameToId).filter(Boolean); ev.clubCup.sessions = ev.clubCup.sessions && ev.clubCup.sessions.length ? ev.clubCup.sessions : [{id:'s1', label:'Session 1'}] }
    ev.matches.forEach(m => { m.eventId = m.eventId || ev.id; if (m.sideAPlayers) m.aIds = m.sideAPlayers.map(nameToId).filter(Boolean); if (m.sideBPlayers) m.bIds = m.sideBPlayers.map(nameToId).filter(Boolean) });
    ev.published = true; ev.drawnAt = Date.now(); ev.id = ev.id || 'e' + uid();
    return ev;
  });
  const b = st.branding || {}, c = cfg() || {};
  const conf = Object.assign({}, c, {name:name || st.tournamentName || c.name || 'Imported tournament', club:b.hostName || st.tournamentLocation || '', sport:/^pb_/.test((st.scoringDefaults || {}).main || '') ? 'pickleball' : 'tennis',
    start:days[0] ? days[0].date : start, end:days.length ? days[days.length - 1].date : start, days, slotMinutes:sc.slotMinutes || 90,
    courts:Array.from({length:st.tournamentCourts || 6}, (_, i) => ({name:'Court ' + (i + 1)})), rules:st.scheduleRules || {}, maxEvents:st.maxDivisionsPerPlayer || 0,
    info:{rules:st.infoRules || '', rain:st.infoRainPlan || '', contact:[st.infoContactName, st.infoContactPhone, st.infoContactEmail].filter(Boolean).join(', ')},
    sponsors:(b.sponsors || []).map(s => ({name:s.name || '', logo:s.logoUrl || null})), logo:b.hostLogoUrl || c.logo || null, logoKeep:!!b.hostLogoUrl, logoOrig:b.hostLogoUrl || null, logoColor:b.hostLogoUrl || null,
    imported:{from:'bracketly', at:Date.now()}});
  Store.keys('m:').forEach(k => Store.del(k));
  Store.set('config', conf); Store.set('players', pl); Store.set('events', evs);
  Object.entries(st.results || {}).forEach(([id, w]) => { if (w) Store.set('m:' + id, {w, s:(st.scores || {})[id] || null, by:'import', ts:Date.now()}) });
  if (conf.name) Dir.rename(conf.name).catch(() => {});
}

document.addEventListener('click', e => {
  const el = e.target.closest('[data-act]'); if (!el) return;
  if (e.target.closest('a')) return;
  if (el.classList.contains('modal') && e.target.closest('[data-stop]') && !e.target.closest('[data-act]:not(.modal)')) return;
  const fn = ACT[el.dataset.act]; if (!fn) return;
  e.preventDefault();
  let out; try{ out = fn(el, e) }catch(err){ console.error(err); toast(err.message || String(err)) }
  const resnap = () => { if (TRIP && cfg() && snap) try{ snap = takeSnap() }catch(err){} };
  resnap(); render(); if (out && out.then) out.then(() => { resnap(); render() }, err => { console.error(err); toast(err.message || String(err)); render() });
});

document.addEventListener('input', e => { const id = e.target.id; if (id === 'divpaste') view.divPaste = e.target.value; if (/^qa-\d$/.test(id)){ if (!view.qa || view.qa.ev !== e.target.dataset.ev) view.qa = {ev:e.target.dataset.ev}; view.qa[id] = e.target.value } if (id === 'announce') view.annDraft = e.target.value; if (id === 'chatDraft') view.draft = e.target.value; if (id === 'pin') view.pin = e.target.value; if (id === 'paste') view.paste = e.target.value; if (id === 'cev-name') view.cevName = e.target.value; if (id === 'joincode') view.joinCode = e.target.value; if (id === 'whoq' || id === 'plq'){ view.q = e.target.value; render() } if (id === 'divq'){ view.dq = e.target.value; render() } { const sc = /^sc-(\d+)-(\d)$/.exec(id || ''); if (sc && view.modal === 'match'){ const m = findMatch(view.matchId); if (m){ if (!view.sm || view.sm.id !== m.id || !view.sm.rows) view.sm = {id:m.id, mode:'edit', rows:readScoreInputs(m)}; const v = e.target.value, x = v === '' ? null : parseInt(v, 10); const was = decidedEarly(m, view.sm.rows); (view.sm.rows[+sc[1]] = view.sm.rows[+sc[1]] || [null, null])[+sc[2]] = isNaN(x) ? null : x; view.sm.err = null; if (view.sm.mode === 'edit' && +sc[1] < 2 && was !== decidedEarly(m, view.sm.rows)){ if (!was) view.sm.rows[2] = [null, null]; render() } } } } if (id === 'eq'){ view.eq = e.target.value; render() } });
document.addEventListener('toggle', e => { const d = e.target; if (d && d.tagName === 'DETAILS' && d.dataset && d.dataset.k){ view.open = view.open || {}; view.open[d.dataset.k] = d.open } }, true);
document.addEventListener('keydown', e => {
  if (e.key === 'Escape' && (view.modal || view.ask)){ if (view.ask) ACT.askno(); else view.modal = null; render(); return }
  const id = e.target.id; if (e.key !== 'Enter') return;

  if (id === 'chatDraft') run('send'); else if (id === 'pin') run('unlock'); else if (id === 'joincode') run('join'); else if (id === 'nt-pin') run('createtrip'); else if (id === 'askin') run('askyes');

Object.assign(ACT, {

  async vidrm(){ if (needAdmin()) return; if (!(await ask('Remove the welcome video for everyone?', {ok:'Remove', danger:true}))) return; const c = cfg(); c.welcome = Object.assign({}, c.welcome || {}, {video:null}); Store.set('config', c); render() },
  introskip(){ const v = welcome().video; if (v) LS.set(TK('intro'), v.ver); view.introForce = false },
  /* player cards */
  cardedit(el){ view.cardPid = el.dataset.id; view.cardDraft = null; view.cardErr = null; view.cardFrom = view.modal === 'player' ? 'player' : null; view.pid = el.dataset.id; view.modal = 'cardedit' },
  cardback(el, e){ if (e && e.target.closest('[data-stop]') && el.classList.contains('modal')) return; view.modal = view.cardFrom === 'player' ? 'player' : null; view.cardDraft = null },
  cardphotorm(){ cardRead().photo = null },
  async cardsave(){
    const pid = view.cardPid, d = cardRead(); if (!canEditCard(pid)) return toast('Only this player or a director can edit this card.');
    view.cardBusy = true; view.cardErr = null; render();
    try{ const row = await Dir.saveCard(pid, d); view.cards = Object.assign({}, view.cards || {}, {[pid]:row}); view.modal = view.cardFrom === 'player' ? 'player' : null; view.cardDraft = null; toast('Card saved.') }
    catch(e){ view.cardErr = e.message || String(e) }
    view.cardBusy = false;
  },
  async cardshare(el){
    try{ const blob = await drawPlayerCard(el.dataset.id), name = ((P(el.dataset.id) || {}).name || 'Player').replace(/[^\w]+/g, '-');
      const file = new File([blob], `${name}-player-card.png`, {type:'image/png'});

      else { const a = document.createElement('a'); a.href = URL.createObjectURL(blob); a.download = file.name; document.body.appendChild(a); a.click(); setTimeout(() => { URL.revokeObjectURL(a.href); a.remove() }, 1500); toast('Card image saved.') } }
    catch(e){ if (!(e && e.name === 'AbortError')) toast("Couldn't make the card image.") }
  },
  /* invites: director */
  invrole(el){ view.invForm = Object.assign({}, view.invForm, invFormRead(), {role:el.dataset.v}) },
  async invcreate(){
    if (needAdmin()) return; const f = Object.assign({role:'player'}, view.invForm, invFormRead());
    if (f.email && !/^[^\s@]+@[^\s@]+\.[^\s@]+$/.test(f.email)) { view.invForm = f; view.invFormErr = "That email doesn't look right. Leave it blank if you don't need it."; return }
    if (f.player && !f.name) f.name = (P(f.player) || {}).name || '';
    view.invForm = f; view.invFormErr = null; view.invBusy = true; render();
    try{ const r = await Dir.createInvite(f); view.invNew = r; view.invForm = {role:f.role}; view.invList = [r].concat((view.invList || []).filter(x => x.id !== r.id)) }
    catch(e){ view.invFormErr = (e.message || String(e)) }
    view.invBusy = false;
  },
  async invrevoke(el){ if (!(await ask('Cancel this invite? The link stops working.', {ok:'Cancel invite', danger:true}))) return; try{ await Dir.revokeInvite(el.dataset.id); if (view.invNew && view.invNew.id === el.dataset.id) view.invNew = null; view.invList = undefined; loadInvites() }catch(e){ toast(e.message || "Couldn't cancel it.") } },
  async invshare(el){ try{ await navigator.share({title:tripTitle(), text:`${el.dataset.n ? el.dataset.n + ', you' : 'You'}'re invited to ${tripTitle()} on Bracketly.`, url:inviteURL(el.dataset.code)}) }catch(e){} },
  /* invites: landing */
  async invcode(){
    const el = document.getElementById('joincode'), code = cleanInvite(el ? el.value : view.joinCode); view.joinCode = code; view.joinErr = null; view.invErr = null;

    try{ await enterTrip(await Dir.join(code)) }catch(e){ view.joinErr = code.length === 10 ? 'No invite or tournament with that code.' : (e.message || String(e)).replace(/trip/gi, 'tournament') }
  },
  async invaccept(el){
    view.invErr = null; render();

      if (rec.player && P(rec.player)){ view.me = rec.player; LS.set(TK('me'), rec.player) }
      toast(rec.role === 'admin' ? "You're a co-director. Director tools are unlocked on this device." : rec.player && P(rec.player) ? `Welcome, ${P(rec.player).name.split(' ')[0]}.` : 'Welcome to the tournament.') }

function invFormRead(){ const g = id => { const el = document.getElementById(id); return el ? el.value.trim() : undefined }, o = {}; [['player', 'inv-pl'], ['name', 'inv-name'], ['email', 'inv-email']].forEach(([k, id]) => { const v = g(id); if (v !== undefined) o[k] = v }); return o }
Object.assign(CHG, {
  brandbool(el){ const [a, b] = el.dataset.p.split('.'); brandSet(x => { if (b) x[a] = Object.assign({}, x[a], {[b]:el.checked}); else x[a] = el.checked }) },
  async brandpic(el){ const f = el.files[0]; el.value = ''; if (!f) return; if (f.size > MAX_IMG_BYTES) return toast('That photo is over 15 MB. Try a smaller one.');
    view.mediaBusy = 'Uploading…'; render();
    try{ const url = await Dir.uploadMedia(await imgBlob(f, 1600), 'jpg', 'brand'); brandSet(b => { b[el.dataset.p] = url }); toast('Photo updated for everyone.') }catch(e){ toast('Upload failed: ' + ((e && e.message) || e)) }

  async galadd(el){ const fs = [...el.files]; el.value = ''; if (!fs.length) return; const room = MAX_GALLERY - brand().gallery.length; const list = fs.slice(0, room), added = []; let bad = 0;

    view.mediaBusy = null; if (added.length) brandSet(b => { b.gallery = b.gallery.concat(added).slice(0, MAX_GALLERY) }); else render();
    if (bad || fs.length > room) toast([bad ? `${bad} photo${bad === 1 ? '' : 's'} couldn't be added.` : '', fs.length > room ? `The gallery holds ${MAX_GALLERY}.` : ''].filter(Boolean).join(' ')) },
  galcap(el){ brandSet(b => { const x = b.gallery[+el.dataset.i]; if (x) x.cap = el.value.trim().slice(0, 120) }) },
  async cardphoto(el){ const f = el.files[0]; el.value = ''; if (!f) return; const d = cardRead(); if (f.size > MAX_IMG_BYTES) { view.cardErr = 'That photo is over 15 MB.'; render(); return }
    view.cardBusy = true; view.cardErr = null; render();

  vidtitle(el){ if (needAdmin()) return; const c = cfg(), w = Object.assign({}, c.welcome || {}); if (!w.video) { toast('Add a video first.'); return } w.video = Object.assign({}, w.video, {title:el.value.trim().slice(0, 80)}); c.welcome = w; Store.set('config', c) },
  async vidfile(el){ const f = el.files[0]; el.value = ''; if (!f) return; if (needAdmin()) return;
    const lim = Dir.mode === 'local' ? 8 * 1024 * 1024 : MAX_VIDEO_BYTES; if (f.size > lim) return toast(`That video is over ${Math.round(lim / 1048576)} MB. Use a YouTube or Vimeo link instead.`);

(async () => {
  { const q0 = new URLSearchParams(location.search), h0 = (location.hash.match(/t=([A-Za-z0-9]+)/) || [])[1]; const c0 = q0.get('join') || h0; if (c0) view.resolving = String(c0).toUpperCase().slice(0, 8) }
  render();
  await Dir.init();
  view.myTrips = null; render();
  const qs = new URLSearchParams(location.search), hash = (location.hash.match(/t=([A-Za-z0-9]+)/) || [])[1];
  view.tv = qs.get('tv') === '1'; view.signup = qs.get('signup') === '1';
  const invQ = cleanInvite(qs.get('invite'));
  if (invQ && Dir.ready && !Dir.err){ view.lseg = 'invites'; try{ view.invPeek = await Dir.peekInvite(invQ) }catch(e){ view.invErr = e.message || String(e) } try{ qs.delete('invite'); history.replaceState(null, '', location.pathname + (qs.toString() ? '?' + qs.toString() : '')) }catch(e){} }
  const TABMAP = {draws:'draws', courts:'courts', chat:'chat', bets:'bets', board:'courts', schedule:'schedule', more:'more'}, wantTab = TABMAP[qs.get('tab')];
  if ('serviceWorker' in navigator) navigator.serviceWorker.addEventListener('message', e => { const t = TABMAP[(e.data || {}).tab]; if (t && TRIP){ view.tab = t; view.modal = null; view.screen = 'app'; render() } });
  const code = invQ ? null : qs.get('join') || hash || (view.tv ? null : LS.get('bkt-last', null));
  if (code && Dir.ready && !Dir.err){
    view.resolving = String(code).toUpperCase().slice(0, 8); render();
    try{ await enterTrip(await Dir.join(code), {tv:view.tv}) }catch(e){ console.warn('open', e); view.joinCode = code; view.joinErr = qs.get('join') ? (e.message || String(e)).replace(/trip/gi, 'tournament') : null; view.tv = false; view.signup = false; LS.del('bkt-last'); render() }
  }
  view.resolving = null; render();
  if (TRIP && wantTab){ view.tab = wantTab; render() }

  if ('serviceWorker' in navigator && location.protocol === 'https:' && !window.claude && window.top === window.self){
    navigator.serviceWorker.register('sw.js').then(reg => { reg.update(); document.addEventListener('visibilitychange', () => { if (!document.hidden) reg.update() }) }).catch(() => {});

  }
